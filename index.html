at He [i.e., Allāh] may enrage by them the disbelievers. Allāh has promised those who believe and do righteous deeds among them forgiveness and a great reward.","মুহাম্মদ আল্লাহর রসূল এবং তাঁর সহচরগণ কাফেরদের প্রতি কঠোর, নিজেদের মধ্যে পরস্পর সহানুভূতিশীল। আল্লাহর অনুগ্রহ ও সন্তুষ্টি কামনায় আপনি তাদেরকে রুকু ও সেজদারত দেখবেন। তাদের মুখমন্ডলে রয়েছে সেজদার চিহ্ন । তওরাতে তাদের অবস্থা এরূপ এবং ইঞ্জিলে তাদের অবস্থা যেমন একটি চারা গাছ যা থেকে নির্গত হয় কিশলয়, অতঃপর তা শক্ত ও মজবুত হয় এবং কান্ডের উপর দাঁড়ায় দৃঢ়ভাবে-চাষীকে আনন্দে অভিভুত করে-যাতে আল্লাহ তাদের দ্বারা কাফেরদের অন্তর্জালা সৃষ্টি করেন। তাদের মধ্যে যারা বিশ্বাস স্থাপন করে এবং সৎকর্ম করে, আল্লাহ তাদেরকে ক্ষমা ও মহাপুরস্কারের ওয়াদা দিয়েছেন।",[[9,18],[18,12],[40,16],[42,4]]],[49,5,"وَلَوْ أَنَّهُمْ صَبَرُوا۟ حَتَّىٰ تَخْرُجَ إِلَيْهِمْ لَكَانَ خَيْرًۭا لَّهُمْ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ","And if they had been patient until you [could] come out to them, it would have been better for them. But Allāh is Forgiving and Merciful.","যদি তারা আপনার বের হয়ে তাদের কাছে আসা পর্যন্ত সবর করত, তবে তা-ই তাদের জন্যে মঙ্গলজনক হত। আল্লাহ ক্ষমাশীল, পরম দয়ালু।",[[12,18]]],[49,6,"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن جَآءَكُمْ فَاسِقٌۢ بِنَبَإٍۢ فَتَبَيَّنُوٓا۟ أَن تُصِيبُوا۟ قَوْمًۢا بِجَهَـٰلَةٍۢ فَتُصْبِحُوا۟ عَلَىٰ مَا فَعَلْتُمْ نَـٰدِمِينَ","O you who have believed, if there comes to you a disobedient one with information, investigate, lest you harm a people out of ignorance and become, over what you have done, regretful.","মুমিনগণ! যদি কোন পাপাচারী ব্যক্তি তোমাদের কাছে কোন সংবাদ আনয়ন করে, তবে তোমরা পরীক্ষা করে দেখবে, যাতে অজ্ঞতাবশতঃ তোমরা কোন সম্প্রদায়ের ক্ষতিসাধনে প্রবৃত্ত না হও এবং পরে নিজেদের কৃতকর্মের জন্যে অনুতপ্ত না হও।",[[17,10]]],[49,7,"وَٱعْلَمُوٓا۟ أَنَّ فِيكُمْ رَسُولَ ٱللَّهِ ۚ لَوْ يُطِيعُكُمْ فِى كَثِيرٍۢ مِّنَ ٱلْأَمْرِ لَعَنِتُّمْ وَلَـٰكِنَّ ٱللَّهَ حَبَّبَ إِلَيْكُمُ ٱلْإِيمَـٰنَ وَزَيَّنَهُۥ فِى قُلُوبِكُمْ وَكَرَّهَ إِلَيْكُمُ ٱلْكُفْرَ وَٱلْفُسُوقَ وَٱلْعِصْيَانَ ۚ أُو۟لَـٰٓئِكَ هُمُ ٱلرَّٰشِدُونَ","And know that among you is the Messenger of Allāh. If he were to obey you in much of the matter, you would be in difficulty, but Allāh has endeared to you the faith and has made it pleasing in your hearts and has made hateful to you disbelief, defiance and disobedience. Those are the [rightly] guided.","তোমরা জেনে রাখ তোমাদের মধ্যে আল্লাহর রসূল রয়েছেন। তিনি যদি অনেক বিষয়ে তোমাদের আবদার মেনে নেন, তবে তোমরাই কষ্ট পাবে। কিন্তু আল্লাহ তোমাদের অন্তরে ঈমানের মহব্বত সৃষ্টি করে দিয়েছেন এবং তা হৃদয়গ্রাহী করে দিয়েছেন। পক্ষান্তরে কুফর, পাপাচার ও নাফরমানীর প্রতি ঘৃণা সৃষ্টি করে দিয়েছেন। তারাই সৎপথ অবলম্বনকারী।",[[15,5],[21,7]]],[49,9,"وَإِن طَآئِفَتَانِ مِنَ ٱلْمُؤْمِنِينَ ٱقْتَتَلُوا۟ فَأَصْلِحُوا۟ بَيْنَهُمَا ۖ فَإِنۢ بَغَتْ إِحْدَىٰهُمَا عَلَى ٱلْأُخْرَىٰ فَقَـٰتِلُوا۟ ٱلَّتِى تَبْغِى حَتَّىٰ تَفِىٓءَ إِلَىٰٓ أَمْرِ ٱللَّهِ ۚ فَإِن فَآءَتْ فَأَصْلِحُوا۟ بَيْنَهُمَا بِٱلْعَدْلِ وَأَقْسِطُوٓا۟ ۖ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُقْسِطِينَ","And if two factions among the believers should fight, then make settlement between the two. But if one of them oppresses the other, then fight against the one that oppresses until it returns to the ordinance of Allāh. And if it returns, then make settlement between them in justice and act justly. Indeed, Allāh loves those who act justly.","যদি মুমিনদের দুই দল যুদ্ধে লিপ্ত হয়ে পড়ে, তবে তোমরা তাদের মধ্যে মীমাংসা করে দিবে। অতঃপর যদি তাদের একদল অপর দলের উপর চড়াও হয়, তবে তোমরা আক্রমণকারী দলের বিরুদ্ধে যুদ্ধ করবে; যে পর্যন্ত না তারা আল্লাহর নির্দেশের দিকে ফিরে আসে। যদি ফিরে আসে, তবে তোমরা তাদের মধ্যে ন্যায়ানুগ পন্থায় মীমাংসা করে দিবে এবং ইনছাফ করবে। নিশ্চয় আল্লাহ ইনছাফকারীদেরকে পছন্দ করেন।",[[29,5]]],[49,10,"إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌۭ فَأَصْلِحُوا۟ بَيْنَ أَخَوَيْكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُرْحَمُونَ","The believers are but brothers, so make settlement between your brothers. And fear Allāh that you may receive mercy.","মুমিনরা তো পরস্পর ভাই-ভাই। অতএব, তোমরা তোমাদের দুই ভাইয়ের মধ্যে মীমাংসা করবে এবং আল্লাহকে ভয় করবে-যাতে তোমরা অনুগ্রহপ্রাপ্ত হও।",[[10,17]]],[49,12,"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱجْتَنِبُوا۟ كَثِيرًۭا مِّنَ ٱلظَّنِّ إِنَّ بَعْضَ ٱلظَّنِّ إِثْمٌۭ ۖ وَلَا تَجَسَّسُوا۟ وَلَا يَغْتَب بَّعْضُكُم بَعْضًا ۚ أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًۭا فَكَرِهْتُمُوهُ ۚ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ تَوَّابٌۭ رَّحِيمٌۭ","O you who have believed, avoid much [negative] assumption. Indeed, some assumption is sin. And do not spy or backbite each other. Would one of you like to eat the flesh of his brother when dead? You would detest it. And fear Allāh; indeed, Allāh is Accepting of Repentance and Merciful.","মুমিনগণ, তোমরা অনেক ধারণা থেকে বেঁচে থাক। নিশ্চয় কতক ধারণা গোনাহ। এবং গোপনীয় বিষয় সন্ধান করো না। তোমাদের কেউ যেন কারও পশ্চাতে নিন্দা না করে। তোমাদের কেউ কি তারা মৃত ভ্রাতার মাংস ভক্ষণ করা পছন্দ করবে? বস্তুতঃ তোমরা তো একে ঘৃণাই কর। আল্লাহকে ভয় কর। নিশ্চয় আল্লাহ তওবা কবুলকারী, পরম দয়ালু।",[[18,5],[25,7],[31,18]]],[49,14,"۞ قَالَتِ ٱلْأَعْرَابُ ءَامَنَّا ۖ قُل لَّمْ تُؤْمِنُوا۟ وَلَـٰكِن قُولُوٓا۟ أَسْلَمْنَا وَلَمَّا يَدْخُلِ ٱلْإِيمَـٰنُ فِى قُلُوبِكُمْ ۖ وَإِن تُطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ لَا يَلِتْكُم مِّنْ أَعْمَـٰلِكُمْ شَيْـًٔا ۚ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌ","The bedouins say, \"We have believed.\" Say, \"You have not [yet] believed; but say [instead], 'We have submitted,' for faith has not yet entered your hearts. And if you obey Allāh and His Messenger, He will not deprive you from your deeds of anything. Indeed, Allāh is Forgiving and Merciful.\"","মরুবাসীরা বলেঃ আমরা বিশ্বাস স্থাপন করেছি। বলুনঃ তোমরা বিশ্বাস স্থাপন করনি; বরং বল, আমরা বশ্যতা স্বীকার করেছি। এখনও তোমাদের অন্তরে বিশ্বাস জন্মেনি। যদি তোমরা আল্লাহ ও তাঁর রসূলের আনুগত্য কর, তবে তোমাদের কর্ম বিন্দুমাত্রও নিস্ফল করা হবে না। নিশ্চয়, আল্লাহ ক্ষমাশীল, পরম মেহেরবান।",[[27,18]]],[50,2,"بَلْ عَجِبُوٓا۟ أَن جَآءَهُم مُّنذِرٌۭ مِّنْهُمْ فَقَالَ ٱلْكَـٰفِرُونَ هَـٰذَا شَىْءٌ عَجِيبٌ","But they wonder that there has come to them a warner from among themselves, and the disbelievers say, \"This is an amazing thing.","বরং তারা তাদের মধ্য থেকেই একজন ভয় প্রদর্শনকারী আগমন করেছে দেখে বিস্ময় বোধ করে। অতঃপর কাফেররা বলেঃ এটা আশ্চর্যের ব্যাপার।",[[2,16],[11,16]]],[50,33,"مَّنْ خَشِىَ ٱلرَّحْمَـٰنَ بِٱلْغَيْبِ وَجَآءَ بِقَلْبٍۢ مُّنِيبٍ","Who feared the Most Merciful in the unseen and came with a heart returning [in repentance].","যে না দেখে দয়াময় আল্লাহ তা’আলাকে ভয় করত এবং বিনীত অন্তরে উপস্থিত হত।",[[2,0],[3,18]]],[50,45,"نَّحْنُ أَعْلَمُ بِمَا يَقُولُونَ ۖ وَمَآ أَنتَ عَلَيْهِم بِجَبَّارٍۢ ۖ فَذَكِّرْ بِٱلْقُرْءَانِ مَن يَخَافُ وَعِيدِ","We are most knowing of what they say, and you are not over them a tyrant. But remind by the Qur’ān whoever fears My threat.","তারা যা বলে, তা আমি সম্যক অবগত আছি। আপনি তাদের উপর জোরজবরকারী নন। অতএব, যে আমার শাস্তিকে ভয় করে, তাকে কোরআনের মাধ্যমে উপদেশ দান করুন।",[[12,0]]],[51,28,"فَأَوْجَسَ مِنْهُمْ خِيفَةًۭ ۖ قَالُوا۟ لَا تَخَفْ ۖ وَبَشَّرُوهُ بِغُلَـٰمٍ عَلِيمٍۢ","And he felt from them apprehension. They said, \"Fear not,\" and gave him good tidings of a learned boy.","অতঃপর তাদের সম্পর্কে সে মনে মনে ভীত হলঃ তারা বললঃ ভীত হবেন না। তারা তাঁকে একট জ্ঞানীগুণী পুত্র সন্তানের সুসংবাদ দিল।",[[1,0],[3,0],[6,0]]],[51,37,"وَتَرَكْنَا فِيهَآ ءَايَةًۭ لِّلَّذِينَ يَخَافُونَ ٱلْعَذَابَ ٱلْأَلِيمَ","And We left therein a sign for those who fear the painful punishment.","যারা যন্ত্রণাদায়ক শাস্তিকে ভয় করে, আমি তাদের জন্যে সেখানে একটি নিদর্শন রেখেছি।",[[5,0]]],[52,18,"فَـٰكِهِينَ بِمَآ ءَاتَىٰهُمْ رَبُّهُمْ وَوَقَىٰهُمْ رَبُّهُمْ عَذَابَ ٱلْجَحِيمِ","Enjoying what their Lord has given them, and their Lord protected them from the punishment of Hellfire.","তারা উপভোগ করবে যা তাদের পালনকর্তা তাদের দেবেন এবং তিনি জাহান্নামের আযাব থেকে তাদেরকে রক্ষা করবেন।",[[1,2]]],[52,22,"وَأَمْدَدْنَـٰهُم بِفَـٰكِهَةٍۢ وَلَحْمٍۢ مِّمَّا يَشْتَهُونَ","And We will provide them with fruit and meat from whatever they desire.","আমি তাদেরকে দেব ফল-মূল এবং মাংস যা তারা চাইবে।",[[5,6]]],[52,26,"قَالُوٓا۟ إِنَّا كُنَّا قَبْلُ فِىٓ أَهْلِنَا مُشْفِقِينَ","They will say, \"Indeed, we were previously among our people fearful [of displeasing Allāh].","তারা বলবেঃ আমরা ইতিপূর্বে নিজেদের বাসগৃহে ভীত-কম্পিত ছিলাম।",[[7,0]]],[52,28,"إِنَّا كُنَّا مِن قَبْلُ نَدْعُوهُ ۖ إِنَّهُۥ هُوَ ٱلْبَرُّ ٱلرَّحِيمُ","Indeed, we used to supplicate Him before. Indeed, it is He who is the Beneficent, the Merciful.\"","আমরা পূর্বেও আল্লাহকে ডাকতাম। তিনি সৌজন্যশীল, পরম দয়ালু।",[[9,18]]],[53,3,"وَمَا يَنطِقُ عَنِ ٱلْهَوَىٰٓ","Nor does he speak from [his own] inclination.","এবং প্রবৃত্তির তাড়নায় কথা বলেন না।",[[4,6]]],[53,23,"إِنْ هِىَ إِلَّآ أَسْمَآءٌۭ سَمَّيْتُمُوهَآ أَنتُمْ وَءَابَآؤُكُم مَّآ أَنزَلَ ٱللَّهُ بِهَا مِن سُلْطَـٰنٍ ۚ إِن يَتَّبِعُونَ إِلَّا ٱلظَّنَّ وَمَا تَهْوَى ٱلْأَنفُسُ ۖ وَلَقَدْ جَآءَهُم مِّن رَّبِّهِمُ ٱلْهُدَىٰٓ","They are not but [mere] names you have named them - you and your forefathers - for which Allāh has sent down no authority. They follow not except assumption and what [their] souls desire, and there has already come to them from their Lord guidance.","এগুলো কতগুলো নাম বৈ নয়, যা তোমরা এবং তোমাদের পূর্ব-পুরুষদের রেখেছ। এর সমর্থনে আল্লাহ কোন দলীল নাযিল করেননি। তারা অনুমান এবং প্রবৃত্তিরই অনুসরণ করে। অথচ তাদের কাছে তাদের পালনকর্তার পক্ষ থেকে পথ নির্দেশ এসেছে।",[[19,6]]],[53,24,"أَمْ لِلْإِنسَـٰنِ مَا تَمَنَّىٰ","Or is there for man whatever he wishes?","মানুষ যা চায়, তাই কি পায়",[[4,6]]],[53,59,"أَفَمِنْ هَـٰذَا ٱلْحَدِيثِ تَعْجَبُونَ","Then at this statement do you wonder?","তোমরা কি এই বিষয়ে আশ্চর্যবোধ করছ",[[4,16]]],[54,3,"وَكَذَّبُوا۟ وَٱتَّبَعُوٓا۟ أَهْوَآءَهُمْ ۚ وَكُلُّ أَمْرٍۢ مُّسْتَقِرٌّۭ","And they denied and followed their inclinations. But for every matter is a [time of] settlement.","তারা মিথ্যারোপ করছে এবং নিজেদের খেয়াল-খুশীর অনুসরণ করছে। প্রত্যেক কাজ যথাসময়ে স্থিরীকৃত হয়।",[[3,6]]],[54,7,"خُشَّعًا أَبْصَـٰرُهُمْ يَخْرُجُونَ مِنَ ٱلْأَجْدَاثِ كَأَنَّهُمْ جَرَادٌۭ مُّنتَشِرٌۭ","Their eyes humbled, they will emerge from the graves as if they were locusts spreading,","তারা তখন অবনমিত নেত্রে কবর থেকে বের হবে বিক্ষিপ্ত পংগপাল সদৃশ।",[[1,1]]],[55,1,"ٱلرَّحْمَـٰنُ","The Most Merciful","করুনাময় আল্লাহ।",[[1,18]]],[55,46,"وَلِمَنْ خَافَ مَقَامَ رَبِّهِۦ جَنَّتَانِ","But for he who has feared the position of his Lord are two gardens -","যে ব্যক্তি তার পালনকর্তার সামনে পেশ হওয়ার ভয় রাখে, তার জন্যে রয়েছে দু’টি উদ্যান।",[[2,0]]],[56,21,"وَلَحْمِ طَيْرٍۢ مِّمَّا يَشْتَهُونَ","And the meat of fowl, from whatever they desire.","এবং রুচিমত পাখীর মাংস নিয়ে।",[[4,6]]],[57,9,"هُوَ ٱلَّذِى يُنَزِّلُ عَلَىٰ عَبْدِهِۦٓ ءَايَـٰتٍۭ بَيِّنَـٰتٍۢ لِّيُخْرِجَكُم مِّنَ ٱلظُّلُمَـٰتِ إِلَى ٱلنُّورِ ۚ وَإِنَّ ٱللَّهَ بِكُمْ لَرَءُوفٌۭ رَّحِيمٌۭ","It is He who sends down upon His Servant [Muḥammad (ﷺ)] verses of clear evidence that He may bring you out from darknesses into the light. And indeed, Allāh is to you Kind and Merciful.","তিনিই তাঁর দাসের প্রতি প্রকাশ্য আয়াত অবতীর্ণ করেন, যাতে তোমাদেরকে অন্ধকার থেকে আলোকে আনয়ন করেন। নিশ্চয় আল্লাহ তোমাদের প্রতি করুণাময়, পরম দয়ালু।",[[16,18],[17,18]]],[57,13,"يَوْمَ يَقُولُ ٱلْمُنَـٰفِقُونَ وَٱلْمُنَـٰفِقَـٰتُ لِلَّذِينَ ءَامَنُوا۟ ٱنظُرُونَا نَقْتَبِسْ مِن نُّورِكُمْ قِيلَ ٱرْجِعُوا۟ وَرَآءَكُمْ فَٱلْتَمِسُوا۟ نُورًۭا فَضُرِبَ بَيْنَهُم بِسُورٍۢ لَّهُۥ بَابٌۢ بَاطِنُهُۥ فِيهِ ٱلرَّحْمَةُ وَظَـٰهِرُهُۥ مِن قِبَلِهِ ٱلْعَذَابُ","On the [same] Day the hypocrite men and hypocrite women will say to those who believed, \"Wait for us that we may acquire some of your light.\" It will be said, \"Go back behind you and seek light.\" And a wall will be placed between them with a door, its interior containing mercy, but on the outside of it is torment.","যেদিন কপট বিশ্বাসী পুরুষ ও কপট বিশ্বাসিনী নারীরা মুমিনদেরকে বলবেঃ তোমরা আমাদের জন্যে অপেক্ষা কর, আমরাও কিছু আলো নিব তোমাদের জ্যোতি থেকে। বলা হবেঃ তোমরা পিছনে ফিরে যাও ও আলোর খোঁজ কর। অতঃপর উভয় দলের মাঝখানে খাড়া করা হবে একটি প্রাচীর, যার একটি দরজা হবে। তার অভ্যন্তরে থাকবে রহমত এবং বাইরে থাকবে আযাব।",[[23,17]]],[57,14,"يُنَادُونَهُمْ أَلَمْ نَكُن مَّعَكُمْ ۖ قَالُوا۟ بَلَىٰ وَلَـٰكِنَّكُمْ فَتَنتُمْ أَنفُسَكُمْ وَتَرَبَّصْتُمْ وَٱرْتَبْتُمْ وَغَرَّتْكُمُ ٱلْأَمَانِىُّ حَتَّىٰ جَآءَ أَمْرُ ٱللَّهِ وَغَرَّكُم بِٱللَّهِ ٱلْغَرُورُ","They [i.e., the hypocrites] will call to them [i.e., the believers], \"Were we not with you?\" They will say, \"Yes, but you afflicted yourselves and awaited [misfortune for us] and doubted, and wishful thinking deluded you until there came the command of Allāh. And the Deceiver [i.e., Satan] deceived you concerning Allāh.","তারা মুমিনদেরকে ডেকে বলবেঃ আমরা কি তোমাদের সাথে ছিলাম না? তারা বলবেঃ হঁ্যা কিন্তু তোমরা নিজেরাই নিজেদেরকে বিপদগ্রস্ত করেছ। প্রতীক্ষা করেছ, সন্দেহ পোষণ করেছ এবং অলীক আশার পেছনে বিভ্রান্ত হয়েছ, অবশেষে আল্লাহর আদেশ পৌঁছেছে। এই সবই তোমাদেরকে আল্লাহ সম্পর্কে প্রতারিত করেছে।",[[13,6]]],[57,16,"۞ أَلَمْ يَأْنِ لِلَّذِينَ ءَامَنُوٓا۟ أَن تَخْشَعَ قُلُوبُهُمْ لِذِكْرِ ٱللَّهِ وَمَا نَزَلَ مِنَ ٱلْحَقِّ وَلَا يَكُونُوا۟ كَٱلَّذِينَ أُوتُوا۟ ٱلْكِتَـٰبَ مِن قَبْلُ فَطَالَ عَلَيْهِمُ ٱلْأَمَدُ فَقَسَتْ قُلُوبُهُمْ ۖ وَكَثِيرٌۭ مِّنْهُمْ فَـٰسِقُونَ","Has the time not come for those who have believed that their hearts should become humbly submissive at the remembrance of Allāh and what has come down of the truth? And let them not be like those who were given the Scripture before, and a long period passed over them, so their hearts hardened; and many of them are defiantly disobedient.","যারা মুমিন, তাদের জন্যে কি আল্লাহর স্মরণে এবং যে সত্য অবর্তীর্ণ হয়েছে, তার কারণে হৃদয় বিগলিত হওয়ার সময় আসেনি? তারা তাদের মত যেন না হয়, যাদেরকে পূর্বে কিতাব দেয়া হয়েছিল। তাদের উপর সুদীর্ঘকাল অতিক্রান্ত হয়েছে, অতঃপর তাদের অন্তঃকরণ কঠিন হয়ে গেছে। তাদের অধিকাংশই পাপাচারী।",[[6,1]]],[57,20,"ٱعْلَمُوٓا۟ أَنَّمَا ٱلْحَيَوٰةُ ٱلدُّنْيَا لَعِبٌۭ وَلَهْوٌۭ وَزِينَةٌۭ وَتَفَاخُرٌۢ بَيْنَكُمْ وَتَكَاثُرٌۭ فِى ٱلْأَمْوَٰلِ وَٱلْأَوْلَـٰدِ ۖ كَمَثَلِ غَيْثٍ أَعْجَبَ ٱلْكُفَّارَ نَبَاتُهُۥ ثُمَّ يَهِيجُ فَتَرَىٰهُ مُصْفَرًّۭا ثُمَّ يَكُونُ حُطَـٰمًۭا ۖ وَفِى ٱلْـَٔاخِرَةِ عَذَابٌۭ شَدِيدٌۭ وَمَغْفِرَةٌۭ مِّنَ ٱللَّهِ وَرِضْوَٰنٌۭ ۚ وَمَا ٱلْحَيَوٰةُ ٱلدُّنْيَآ إِلَّا مَتَـٰعُ ٱلْغُرُورِ","Know that the life of this world is but amusement and diversion and adornment and boasting to one another and competition in increase of wealth and children - like the example of a rain whose [resulting] plant growth pleases the tillers; then it dries and you see it turned yellow; then it becomes [scattered] debris. And in the Hereafter is severe punishment and forgiveness from Allāh and approval. And what is the worldly life except the enjoyment of delusion.","তোমরা জেনে রাখ, পার্থিব জীবন ক্রীড়া-কৌতুক, সাজ-সজ্জা, পারস্পরিক অহমিকা এবং ধন ও জনের প্রাচুর্য ব্যতীত আর কিছু নয়, যেমন এক বৃষ্টির অবস্থা, যার সবুজ ফসল কৃষকদেরকে চমৎকৃত করে, এরপর তা শুকিয়ে যায়, ফলে তুমি তাকে পীতবর্ণ দেখতে পাও, এরপর তা খড়কুটা হয়ে যায়। আর পরকালে আছে কঠিন শাস্তি এবং আল্লাহর ক্ষমা ও সন্তুষ্টি। পার্থিব জীবন প্রতারণার উপকরণ বৈ কিছু নয়।",[[16,16],[33,12]]],[57,23,"لِّكَيْلَا تَأْسَوْا۟ عَلَىٰ مَا فَاتَكُمْ وَلَا تَفْرَحُوا۟ بِمَآ ءَاتَىٰكُمْ ۗ وَٱللَّهُ لَا يُحِبُّ كُلَّ مُخْتَالٍۢ فَخُورٍ","In order that you not despair over what has eluded you and not exult [in pride] over what He has given you. And Allāh does not like everyone self-deluded and boastful -","এটা এজন্যে বলা হয়, যাতে তোমরা যা হারাও তজ্জন্যে দুঃখিত না হও এবং তিনি তোমাদেরকে যা দিয়েছেন, তজ্জন্যে উল্লসিত না হও। আল্লাহ কোন উদ্ধত অহংকারীকে পছন্দ করেন না",[[7,2],[12,5]]],[57,27,"ثُمَّ قَفَّيْنَا عَلَىٰٓ ءَاثَـٰرِهِم بِرُسُلِنَا وَقَفَّيْنَا بِعِيسَى ٱبْنِ مَرْيَمَ وَءَاتَيْنَـٰهُ ٱلْإِنجِيلَ وَجَعَلْنَا فِى قُلُوبِ ٱلَّذِينَ ٱتَّبَعُوهُ رَأْفَةًۭ وَرَحْمَةًۭ وَرَهْبَانِيَّةً ٱبْتَدَعُوهَا مَا كَتَبْنَـٰهَا عَلَيْهِمْ إِلَّا ٱبْتِغَآءَ رِضْوَٰنِ ٱللَّهِ فَمَا رَعَوْهَا حَقَّ رِعَايَتِهَا ۖ فَـَٔاتَيْنَا ٱلَّذِينَ ءَامَنُوا۟ مِنْهُمْ أَجْرَهُمْ ۖ وَكَثِيرٌۭ مِّنْهُمْ فَـٰسِقُونَ","Then We sent following their footsteps [i.e., traditions] Our messengers and followed [them] with Jesus, the son of Mary, and gave him the Gospel. And We placed in the hearts of those who followed him compassion and mercy and monasticism, which they innovated; We did not prescribe it for them except [that they did so] seeking the approval of Allāh. But they did not observe it with due observance. So We gave the ones who believed among them their reward, but many of them are defiantly disobedient.","অতঃপর আমি তাদের পশ্চাতে প্রেরণ করেছি আমার রসূলগণকে এবং তাদের অনুগামী করেছি মরিয়ম তনয় ঈসাকে ও তাকে দিয়েছি ইঞ্জিল। আমি তার অনুসারীদের অন্তরে স্থাপন করেছি নম্রতা ও দয়া। আর বৈরাগ্য, সে তো তারা নিজেরাই উদ্ভাবন করেছে; আমি এটা তাদের উপর ফরজ করিনি; কিন্তু তারা আল্লাহর সন্তুষ্টি লাভের জন্যে এটা অবলম্বন করেছে। অতঃপর তারা যথাযথভাবে তা পালন করেনি। তাদের মধ্যে যারা বিশ্বাসী ছিল, আমি তাদেরকে তাদের প্রাপ্য পুরস্কার দিয়েছি। আর তাদের অধিকাংশই পাপাচারী।",[[17,17],[18,17],[26,12]]],[57,28,"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَءَامِنُوا۟ بِرَسُولِهِۦ يُؤْتِكُمْ كِفْلَيْنِ مِن رَّحْمَتِهِۦ وَيَجْعَل لَّكُمْ نُورًۭا تَمْشُونَ بِهِۦ وَيَغْفِرْ لَكُمْ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ","O you who have believed, fear Allāh and believe in His Messenger; He will [then] give you a double portion of His mercy and make for you a light by which you will walk and forgive you; and Allāh is Forgiving and Merciful.","মুমিনগণ, তোমরা আল্লাহকে ভয় কর এবং তাঁর রসূলের প্রতি বিশ্বাস স্থাপন কর। তিনি নিজে অনুগ্রহের দ্বিগুণ অংশ তোমাদেরকে দিবেন, তোমাদেরকে দিবেন জ্যোতি, যার সাহায্যে তোমরা চলবে এবং তোমাদেরকে ক্ষমা করবেন। আল্লাহ ক্ষমাশীল, দয়াময়।",[[11,17],[21,18]]],[58,10,"إِنَّمَا ٱلنَّجْوَىٰ مِنَ ٱلشَّيْطَـٰنِ لِيَحْزُنَ ٱلَّذِينَ ءَامَنُوا۟ وَلَيْسَ بِضَآرِّهِمْ شَيْـًٔا إِلَّا بِإِذْنِ ٱللَّهِ ۚ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ","Private conversation is only from Satan that he may grieve those who have believed, but he will not harm them at all except by permission of Allāh. And upon Allāh let the believers rely.","এই কানাঘুষা তো শয়তানের কাজ; মুমিনদেরকে দুঃখ দেয়ার দেয়ার জন্যে। তবে আল্লাহর অনুমতি ব্যতীত সে তাদের কোন ক্ষতি করতে পারবে না। মুমিনদের উচিত আল্লাহর উপর ভরসা করা।",[[5,3]]],[58,12,"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا نَـٰجَيْتُمُ ٱلرَّسُولَ فَقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَةًۭ ۚ ذَٰلِكَ خَيْرٌۭ لَّكُمْ وَأَطْهَرُ ۚ فَإِن لَّمْ تَجِدُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌ","O you who have believed, when you [wish to] privately consult the Messenger, present before your consultation a charity. That is better for you and purer. But if you find not [the means] - then indeed, Allāh is Forgiving and Merciful.","মুমিনগণ, তোমরা রসূলের কাছে কানকথা বলতে চাইলে তৎপূর্বে সদকা প্রদান করবে। এটা তোমাদের জন্যে শ্রেয়ঃ ও পবিত্র হওয়ার ভাল উপায়। যদি তাতে সক্ষম না হও, তবে আল্লাহ ক্ষমাশীল, পরম দয়ালু।",[[22,18]]],[58,13,"ءَأَشْفَقْتُمْ أَن تُقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَـٰتٍۢ ۚ فَإِذْ لَمْ تَفْعَلُوا۟ وَتَابَ ٱللَّهُ عَلَيْكُمْ فَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ ۚ وَٱللَّهُ خَبِيرٌۢ بِمَا تَعْمَلُونَ","Have you feared to present before your consultation charities? Then when you do not and Allāh has forgiven you, then [at least] establish prayer and give zakāh and obey Allāh and His Messenger. And Allāh is Aware of what you do.","তোমরা কি কানকথা বলার পূর্বে সদকা প্রদান করতে ভীত হয়ে গেলে? অতঃপর তোমরা যখন সদকা দিতে পারলে না এবং আল্লাহ তোমাদেরকে মাফ করে দিলেন তখন তোমরা নামায কায়েম কর, যাকাত প্রদান কর এবং আল্লাহ ও রসূলের আনুগত্য কর। আল্লাহ খবর রাখেন তোমরা যা কর।",[[1,0]]],[58,14,"۞ أَلَمْ تَرَ إِلَى ٱلَّذِينَ تَوَلَّوْا۟ قَوْمًا غَضِبَ ٱللَّهُ عَلَيْهِم مَّا هُم مِّنكُمْ وَلَا مِنْهُمْ وَيَحْلِفُونَ عَلَى ٱلْكَذِبِ وَهُمْ يَعْلَمُونَ","Have you not considered those who make allies of a people with whom Allāh has become angry? They are neither of you nor of them, and they swear to untruth while they know [they are lying].","আপনি কি তাদের প্রতি লক্ষ্য করেননি, যারা আল্লাহর গযবে নিপতিত সম্প্রদায়ের সাথে বন্ধুত্ব করে? তারা মুসলমানদের দলভুক্ত নয় এবং তাদেরও দলভূক্ত নয়। তারা জেনেশুনে মিথ্যা বিষয়ে শপথ করে।",[[7,4]]],[58,22,"لَّا تَجِدُ قَوْمًۭا يُؤْمِنُونَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ يُوَآدُّونَ مَنْ حَآدَّ ٱللَّهَ وَرَسُولَهُۥ وَلَوْ كَانُوٓا۟ ءَابَآءَهُمْ أَوْ أَبْنَآءَهُمْ أَوْ إِخْوَٰنَهُمْ أَوْ عَشِيرَتَهُمْ ۚ أُو۟لَـٰٓئِكَ كَتَبَ فِى قُلُوبِهِمُ ٱلْإِيمَـٰنَ وَأَيَّدَهُم بِرُوحٍۢ مِّنْهُ ۖ وَيُدْخِلُهُمْ جَنَّـٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَا ۚ رَضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ ۚ أُو۟لَـٰٓئِكَ حِزْبُ ٱللَّهِ ۚ أَلَآ إِنَّ حِزْبَ ٱللَّهِ هُمُ ٱلْمُفْلِحُونَ","You will not find a people who believe in Allāh and the Last Day having affection for those who oppose Allāh and His Messenger, even if they were their fathers or their sons or their brothers or their kindred. Those - He has decreed within their hearts faith and supported them with spirit from Him. And We will admit them to gardens beneath which rivers flow, wherein they abide eternally. Allāh is pleased with them, and they are pleased with Him - those are the party of Allāh. Unquestionably, the party of Allāh - they are the successful.","যারা আল্লাহ ও পরকালে বিশ্বাস করে, তাদেরকে আপনি আল্লাহ ও তাঁর রসূলের বিরুদ্ধাচরণকারীদের সাথে বন্ধুত্ব করতে দেখবেন না, যদিও তারা তাদের পিতা, পুত্র, ভ্রাতা অথবা জ্ঞাতি-গোষ্ঠী হয়। তাদের অন্তরে আল্লাহ ঈমান লিখে দিয়েছেন এবং তাদেরকে শক্তিশালী করেছেন তাঁর অদৃশ্য শক্তি দ্বারা। তিনি তাদেরকে জান্নাতে দাখিল করবেন, যার তলদেশে নদী প্রবাহিত। তারা তথায় চিরকাল থাকবে। আল্লাহ তাদের প্রতি সন্তুষ্ট এবং তারা আল্লাহর প্রতি সন্তুষ্ট। তারাই আল্লাহর দল। জেনে রাখ, আল্লাহর দলই সফলকাম হবে।",[[8,5],[38,12],[41,12]]],[59,2,"هُوَ ٱلَّذِىٓ أَخْرَجَ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَـٰبِ مِن دِيَـٰرِهِمْ لِأَوَّلِ ٱلْحَشْرِ ۚ مَا ظَنَنتُمْ أَن يَخْرُجُوا۟ ۖ وَظَنُّوٓا۟ أَنَّهُم مَّانِعَتُهُمْ حُصُونُهُم مِّنَ ٱللَّهِ فَأَتَىٰهُمُ ٱللَّهُ مِنْ حَيْثُ لَمْ يَحْتَسِبُوا۟ ۖ وَقَذَفَ فِى قُلُوبِهِمُ ٱلرُّعْبَ ۚ يُخْرِبُونَ بُيُوتَهُم بِأَيْدِيهِمْ وَأَيْدِى ٱلْمُؤْمِنِينَ فَٱعْتَبِرُوا۟ يَـٰٓأُو۟لِى ٱلْأَبْصَـٰرِ","It is He who expelled the ones who disbelieved among the People of the Scripture from their homes at the first gathering. You did not think they would leave, and they thought that their fortresses would protect them from Allāh; but [the decree of] Allāh came upon them from where they had not expected, and He cast terror into their hearts [so] they destroyed their houses by their [own] hands and the hands of the believers. So take warning, O people of vision.","তিনিই কিতাবধারীদের মধ্যে যারা কাফের, তাদেরকে প্রথমবার একত্রিত করে তাদের বাড়ী-ঘর থেকে বহিস্কার করেছেন। তোমরা ধারণাও করতে পারনি যে, তারা বের হবে এবং তারা মনে করেছিল যে, তাদের দূর্গগুলো তাদেরকে আল্লাহর কবল থেকে রক্ষা করবে। অতঃপর আল্লাহর শাস্তি তাদের উপর এমনদিক থেকে আসল, যার কল্পনাও তারা করেনি। আল্লাহ তাদের অন্তরে ত্রাস সঞ্চার করে দিলেন। তারা তাদের বাড়ী-ঘর নিজেদের হাতে এবং মুসলমানদের হাতে ধ্বংস করছিল। অতএব, হে চক্ষুষ্মান ব্যক্তিগণ, তোমরা শিক্ষা গ্রহণ কর।",[[32,0]]],[59,8,"لِلْفُقَرَآءِ ٱلْمُهَـٰجِرِينَ ٱلَّذِينَ أُخْرِجُوا۟ مِن دِيَـٰرِهِمْ وَأَمْوَٰلِهِمْ يَبْتَغُونَ فَضْلًۭا مِّنَ ٱللَّهِ وَرِضْوَٰنًۭا وَيَنصُرُونَ ٱللَّهَ وَرَسُولَهُۥٓ ۚ أُو۟لَـٰٓئِكَ هُمُ ٱلصَّـٰدِقُونَ","For the poor emigrants who were expelled from their homes and their properties, seeking bounty from Allāh and [His] approval and supporting [the cause of] Allāh and His Messenger, [there is also a share]. Those are the truthful.","এই ধন-সম্পদ দেশত্যাগী নিঃস্বদের জন্যে, যারা আল্লাহর অনুগ্রহ ও সন্তুষ্টিলাভের অন্বেষণে এবং আল্লাহ তাঁর রসূলের সাহায্যার্থে নিজেদের বাস্তুভিটা ও ধন-সম্পদ থেকে বহিস্কৃত হয়েছে। তারাই সত্যবাদী।",[[12,12]]],[59,9,"وَٱلَّذِينَ تَبَوَّءُو ٱلدَّارَ وَٱلْإِيمَـٰنَ مِن قَبْلِهِمْ يُحِبُّونَ مَنْ هَاجَرَ إِلَيْهِمْ وَلَا يَجِدُونَ فِى صُدُورِهِمْ حَاجَةًۭ مِّمَّآ أُوتُوا۟ وَيُؤْثِرُونَ عَلَىٰٓ أَنفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌۭ ۚ وَمَن يُوقَ شُحَّ نَفْسِهِۦ فَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ","And [also for] those who were settled in the Home [i.e.,al-Madīnah] and [adopted] the faith before them. They love those who emigrated to them and find not any want in their breasts of what they [i.e., the emigrants] were given but give [them] preference over themselves, even though they are in privation. And whoever is protected from the stinginess of his soul - it is those who will be the successful.","যারা মুহাজিরদের আগমনের পূর্বে মদীনায় বসবাস করেছিল এবং বিশ্বাস স্থাপন করেছিল, তারা মুহাজিরদের ভালবাসে, মুহাজিরদেরকে যা দেয়া হয়েছে, তজ্জন্যে তারা অন্তরে ঈর্ষাপোষণ করে না এবং নিজেরা অভাবগ্রস্ত হলেও তাদেরকে অগ্রাধিকার দান করে। যারা মনের কার্পণ্য থেকে মুক্ত, তারাই সফলকাম।",[[7,5]]],[59,10,"وَٱلَّذِينَ جَآءُو مِنۢ بَعْدِهِمْ يَقُولُونَ رَبَّنَا ٱغْفِرْ لَنَا وَلِإِخْوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلْإِيمَـٰنِ وَلَا تَجْعَلْ فِى قُلُوبِنَا غِلًّۭا لِّلَّذِينَ ءَامَنُوا۟ رَبَّنَآ إِنَّكَ رَءُوفٌۭ رَّحِيمٌ","And [there is a share for] those who come after them, saying, \"Our Lord, forgive us and our brothers who preceded us in faith and put not in our hearts [any] resentment toward those who have believed. Our Lord, indeed You are Kind and Merciful.\"","আর এই সম্পদ তাদের জন্যে, যারা তাদের পরে আগমন করেছে। তারা বলেঃ হে আমাদের পালনকর্তা, আমাদেরকে এবং ঈমানে আগ্রহী আমাদের ভ্রাতাগণকে ক্ষমা কর এবং ঈমানদারদের বিরুদ্ধে আমাদের অন্তরে কোন বিদ্বেষ রেখো না। হে আমাদের পালনকর্তা, আপনি দয়ালু, পরম করুণাময়।",[[22,18],[23,18]]],[59,13,"لَأَنتُمْ أَشَدُّ رَهْبَةًۭ فِى صُدُورِهِم مِّنَ ٱللَّهِ ۚ ذَٰلِكَ بِأَنَّهُمْ قَوْمٌۭ لَّا يَفْقَهُونَ","You [believers] are more fearful within their breasts than Allāh. That is because they are a people who do not understand.","নিশ্চয় তোমরা তাদের অন্তরে আল্লাহ তা’আলা অপেক্ষা অধিকতর ভয়াবহ। এটা এ কারণে যে, তারা এক নির্বোধ সম্প্রদায়।",[[3,0]]],[59,16,"كَمَثَلِ ٱلشَّيْطَـٰنِ إِذْ قَالَ لِلْإِنسَـٰنِ ٱكْفُرْ فَلَمَّا كَفَرَ قَالَ إِنِّى بَرِىٓءٌۭ مِّنكَ إِنِّىٓ أَخَافُ ٱللَّهَ رَبَّ ٱلْعَـٰلَمِينَ","[The hypocrites are] like the example of Satan when he says to man, \"Disbelieve.\" But when he disbelieves, he says, \"Indeed, I am disassociated from you. Indeed, I fear Allāh, Lord of the worlds.\"","তারা শয়তানের মত, যে মানুষকে কাফের হতে বলে। অতঃপর যখন সে কাফের হয়, তখন শয়তান বলেঃ তোমার সাথে আমার কোন সম্পর্ক নেই। আমি বিশ্বপালনকর্তা আল্লাহ তা’আলাকে ভয় করি।",[[14,0]]],[59,21,"لَوْ أَنزَلْنَا هَـٰذَا ٱلْقُرْءَانَ عَلَىٰ جَبَلٍۢ لَّرَأَيْتَهُۥ خَـٰشِعًۭا مُّتَصَدِّعًۭا مِّنْ خَشْيَةِ ٱللَّهِ ۚ وَتِلْكَ ٱلْأَمْثَـٰلُ نَضْرِبُهَا لِلنَّاسِ لَعَلَّهُمْ يَتَفَكَّرُونَ","If We had sent down this Qur’ān upon a mountain, you would have seen it humbled and splitting from fear of Allāh. And these examples We present to the people that perhaps they will give thought.","যদি আমি এই কোরআন পাহাড়ের উপর অবতীর্ণ করতাম, তবে তুমি দেখতে যে, পাহাড় বিনীত হয়ে আল্লাহ তা’আলার ভয়ে বিদীর্ণ হয়ে গেছে। আমি এসব দৃষ্টান্ত মানুষের জন্যে বর্ণনা করি, যাতে তারা চিন্তা-ভাবনা করে।",[[8,1],[11,0]]],[59,22,"هُوَ ٱللَّهُ ٱلَّذِى لَآ إِلَـٰهَ إِلَّا هُوَ ۖ عَـٰلِمُ ٱلْغَيْبِ وَٱلشَّهَـٰدَةِ ۖ هُوَ ٱلرَّحْمَـٰنُ ٱلرَّحِيمُ","He is Allāh, other than whom there is no deity, Knower of the unseen and the witnessed. He is the Entirely Merciful, the Especially Merciful.","তিনিই আল্লাহ তা’আলা, তিনি ব্যতীত কোন উপাস্য নেই; তিনি দৃশ্য ও অদৃশ্যকে জানেন তিনি পরম দয়ালু, অসীম দাতা।",[[12,18],[13,18]]],[60,1,"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ عَدُوِّى وَعَدُوَّكُمْ أَوْلِيَآءَ تُلْقُونَ إِلَيْهِم بِٱلْمَوَدَّةِ وَقَدْ كَفَرُوا۟ بِمَا جَآءَكُم مِّنَ ٱلْحَقِّ يُخْرِجُونَ ٱلرَّسُولَ وَإِيَّاكُمْ ۙ أَن تُؤْمِنُوا۟ بِٱللَّهِ رَبِّكُمْ إِن كُنتُمْ خَرَجْتُمْ جِهَـٰدًۭا فِى سَبِيلِى وَٱبْتِغَآءَ مَرْضَاتِى ۚ تُسِرُّونَ إِلَيْهِم بِٱلْمَوَدَّةِ وَأَنَا۠ أَعْلَمُ بِمَآ أَخْفَيْتُمْ وَمَآ أَعْلَنتُمْ ۚ وَمَن يَفْعَلْهُ مِنكُمْ فَقَدْ ضَلَّ سَوَآءَ ٱلسَّبِيلِ","O you who have believed, do not take My enemies and your enemies as allies, extending to them affection while they have disbelieved in what came to you of the truth, having driven out the Prophet and yourselves [only] because you believe in Allāh, your Lord. If you have come out for jihād [i.e., fighting or striving] in My cause and seeking means to My approval, [take them not as friends]. You confide to them affection [i.e., instruction], but I am most knowing of what you have concealed and what you have declared. And whoever does it among you has certainly strayed from the soundness of the way.","মুমিনগণ, তোমরা আমার ও তোমাদের শত্রুদেরকে বন্ধরূপে গ্রহণ করো না। তোমরা তো তাদের প্রতি বন্ধুত্বের বার্তা পাঠাও, অথচ তারা যে সত্য তোমাদের কাছে আগমন করেছে, তা অস্বীকার করছে। তারা রসূলকে ও তোমাদেরকে বহিস্কার করে এই অপরাধে যে, তোমরা তোমাদের পালনকর্তার প্রতি বিশ্বাস রাখ। যদি তোমরা আমার সন্তুষ্টিলাভের জন্যে এবং আমার পথে জেহাদ করার জন্যে বের হয়ে থাক, তবে কেন তাদের প্রতি গোপনে বন্ধুত্বের পয়গাম প্রেরণ করছ? তোমরা যা গোপন কর এবং যা প্রকাশ কর, ত আমি খুব জানি। তোমাদের মধ্যে যে এটা করে, সে সরলপথ থেকে বিচ্যুত হয়ে যায়।",[[11,5],[32,12],[35,5]]],[60,2,"إِن يَثْقَفُوكُمْ يَكُونُوا۟ لَكُمْ أَعْدَآءًۭ وَيَبْسُطُوٓا۟ إِلَيْكُمْ أَيْدِيَهُمْ وَأَلْسِنَتَهُم بِٱلسُّوٓءِ وَوَدُّوا۟ لَوْ تَكْفُرُونَ","If they gain dominance over you, they would be [i.e., behave] to you as enemies and extend against you their hands and their tongues with evil, and they wish you would disbelieve.","তোমাদেরকে করতলগত করতে পারলে তারা তোমাদের শত্রু হয়ে যাবে এবং মন্দ উদ্দেশ্যে তোমাদের প্রতি বাহু ও রসনা প্রসারিত করবে এবং চাইবে যে, কোনরূপে তোমরা ও কাফের হয়ে যাও।",[[11,6]]],[60,4,"قَدْ كَانَتْ لَكُمْ أُسْوَةٌ حَسَنَةٌۭ فِىٓ إِبْرَٰهِيمَ وَٱلَّذِينَ مَعَهُۥٓ إِذْ قَالُوا۟ لِقَوْمِهِمْ إِنَّا بُرَءَٰٓؤُا۟ مِنكُمْ وَمِمَّا تَعْبُدُونَ مِن دُونِ ٱللَّهِ كَفَرْنَا بِكُمْ وَبَدَا بَيْنَنَا وَبَيْنَكُمُ ٱلْعَدَٰوَةُ وَٱلْبَغْضَآءُ أَبَدًا حَتَّىٰ تُؤْمِنُوا۟ بِٱللَّهِ وَحْدَهُۥٓ إِلَّا قَوْلَ إِبْرَٰهِيمَ لِأَبِيهِ لَأَسْتَغْفِرَنَّ لَكَ وَمَآ أَمْلِكُ لَكَ مِنَ ٱللَّهِ مِن شَىْءٍۢ ۖ رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ ٱلْمَصِيرُ","There has already been for you an excellent pattern in Abraham and those with him, when they said to their people, \"Indeed, we are disassociated from you and from whatever you worship other than Allāh. We have denied you, and there has appeared between us and you animosity and hatred forever until you believe in Allāh alone\" - except for the saying of Abraham to his father, \"I will surely ask forgiveness for you, but I have not [power to do] for you anything against Allāh. Our Lord, upon You we have relied, and to You we have returned, and to You is the destination.","তোমাদের জন্যে ইব্রাহীম ও তাঁর সঙ্গীগণের মধ্যে চমৎকার আদর্শ রয়েছে। তারা তাদের সম্প্রদায়কে বলেছিলঃ তোমাদের সাথে এবং তোমরা আল্লাহর পরিবর্তে যার এবাদত কর, তার সাথে আমাদের কোন সম্পর্ক নেই। আমরা তোমাদের মানি না। তোমরা এক আল্লাহর প্রতি বিশ্বাস স্থাপন না করলে তোমাদের মধ্যে ও আমাদের মধ্যে চিরশত্রুতা থাকবে। কিন্তু ইব্রাহীমের উক্তি তাঁর পিতার উদ্দেশে এই আদর্শের ব্যতিক্রম। তিনি বলেছিলেনঃ আমি অবশ্যই তোমার জন্য ক্ষমাপ্রার্থনা করব। তোমার উপকারের জন্যে আল্লাহর কাছে আমার আর কিছু করার নেই। হে আমাদের পালনকর্তা! আমরা তোমারই উপর ভরসা করেছি, তোমারই দিকে মুখ করেছি এবং তোমারই নিকট আমাদের প্রত্যাবর্তন।",[[27,7]]],[60,6,"لَقَدْ كَانَ لَكُمْ فِيهِمْ أُسْوَةٌ حَسَنَةٌۭ لِّمَن كَانَ يَرْجُوا۟ ٱللَّهَ وَٱلْيَوْمَ ٱلْـَٔاخِرَ ۚ وَمَن يَتَوَلَّ فَإِنَّ ٱللَّهَ هُوَ ٱلْغَنِىُّ ٱلْحَمِيدُ","There has certainly been for you in them an excellent pattern for anyone whose hope is in Allāh and the Last Day. And whoever turns away - then indeed, Allāh is the Free of need, the Praiseworthy.","তোমরা যারা আল্লাহ ও পরকাল প্রত্যাশা কর, তোমাদের জন্য তাদের মধ্যে উত্তম আদর্শ রয়েছে। আর যে মুখ ফিরিয়ে নেয়, তার জানা উচিত যে, আল্লাহ বেপরওয়া, প্রশংসার মালিক।",[[9,8]]],[60,7,"۞ عَسَى ٱللَّهُ أَن يَجْعَلَ بَيْنَكُمْ وَبَيْنَ ٱلَّذِينَ عَادَيْتُم مِّنْهُم مَّوَدَّةًۭ ۚ وَٱللَّهُ قَدِيرٌۭ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ","Perhaps Allāh will put, between you and those to whom you have been enemies among them, affection. And Allāh is competent, and Allāh is Forgiving and Merciful.","যারা তোমাদের শত্রু আল্লাহ তাদের মধ্যে ও তোমাদের মধ্যে সম্ভবতঃ বন্ধুত্ব সৃষ্টি করে দেবেন। আল্লাহ সবই করতে পারেন এবং আল্লাহ ক্ষমাশীল, করুণাময়।",[[10,5],[15,18]]],[60,8,"لَّا يَنْهَىٰكُمُ ٱللَّهُ عَنِ ٱلَّذِينَ لَمْ يُقَـٰتِلُوكُمْ فِى ٱلدِّينِ وَلَمْ يُخْرِجُوكُم مِّن دِيَـٰرِكُمْ أَن تَبَرُّوهُمْ وَتُقْسِطُوٓا۟ إِلَيْهِمْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُقْسِطِينَ","Allāh does not forbid you from those who do not fight you because of religion and do not expel you from your homes - from being righteous toward them and acting justly toward them. Indeed, Allāh loves those who act justly.","ধর্মের ব্যাপারে যারা তোমাদের বিরুদ্ধে লড়াই করেনি এবং তোমাদেরকে দেশ থেকে বহিস্কৃত করেনি, তাদের প্রতি সদাচরণ ও ইনসাফ করতে আল্লাহ তোমাদেরকে নিষেধ করেন না। নিশ্চয় আল্লাহ ইনসাফকারীদেরকে ভালবাসেন।",[[20,5]]],[60,12,"يَـٰٓأَيُّهَا ٱلنَّبِىُّ إِذَا جَآءَكَ ٱلْمُؤْمِنَـٰتُ يُبَايِعْنَكَ عَلَىٰٓ أَن لَّا يُشْرِكْنَ بِٱللَّهِ شَيْـًۭٔا وَلَا يَسْرِقْنَ وَلَا يَزْنِينَ وَلَا يَقْتُلْنَ أَوْلَـٰدَهُنَّ وَلَا يَأْتِينَ بِبُهْتَـٰنٍۢ يَفْتَرِينَهُۥ بَيْنَ أَيْدِيهِنَّ وَأَرْجُلِهِنَّ وَلَا يَعْصِينَكَ فِى مَعْرُوفٍۢ ۙ فَبَايِعْهُنَّ وَٱسْتَغْفِرْ لَهُنَّ ٱللَّهَ ۖ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ","O Prophet, when the believing women come to you pledging to you that they will not associate anything with Allāh, nor will they steal, nor will they commit unlawful sexual intercourse, nor will they kill their children, nor will they bring forth a slander they have invented between their arms and legs, nor will they disobey you in what is right - then accept their pledge and ask forgiveness for them of Allāh. Indeed, Allāh is Forgiving and Merciful.","হে নবী, ঈমানদার নারীরা যখন আপনার কাছে এসে আনুগত্যের শপথ করে যে, তারা আল্লাহর সাথে কাউকে শরীক করবে না, চুরি করবে না, ব্যভিচার করবে না, তাদের সন্তানদেরকে হত্যা করবে না, জারজ সন্তানকে স্বামীর ঔরস থেকে আপন গর্ভজাত সন্তান বলে মিথ্যা দাবী করবে না এবং ভাল কাজে আপনার অবাধ্যতা করবে না, তখন তাদের আনুগত্য গ্রহণ করুন এবং তাদের জন্যে আল্লাহর কাছে ক্ষমা প্রার্থনা করুন। নিশ্চয় আল্লাহ ক্ষমাশীল অত্যন্ত দয়ালু।",[[38,18]]],[60,13,"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَوَلَّوْا۟ قَوْمًا غَضِبَ ٱللَّهُ عَلَيْهِمْ قَدْ يَئِسُوا۟ مِنَ ٱلْـَٔاخِرَةِ كَمَا يَئِسَ ٱلْكُفَّارُ مِنْ أَصْحَـٰبِ ٱلْقُبُورِ","O you who have believed, do not make allies of a people with whom Allāh has become angry. They have despaired of [reward in] the Hereafter just as the disbelievers have despaired of [meeting] the companions [i.e., inhabitants] of the graves.","মুমিনগণ, আল্লাহ যে জাতির প্রতি রুষ্ট, তোমরা তাদের সাথে বন্ধুত্ব করো না। তারা পরকাল সম্পর্কে নিরাশ হয়ে গেছে যেমন কবরস্থ কাফেররা নিরাশ হয়ে গেছে।",[[7,4],[11,9],[15,9]]],[61,3,"كَبُرَ مَقْتًا عِندَ ٱللَّهِ أَن تَقُولُوا۟ مَا لَا تَفْعَلُونَ","Greatly hateful in the sight of Allāh is that you say what you do not do.","তোমরা যা কর না, তা বলা আল্লাহর কাছে খুবই অসন্তোষজনক।",[[2,7]]],[61,4,"إِنَّ ٱللَّهَ يُحِبُّ ٱلَّذِينَ يُقَـٰتِلُونَ فِى سَبِيلِهِۦ صَفًّۭا كَأَنَّهُم بُنْيَـٰنٌۭ مَّرْصُوصٌۭ","Indeed, Allāh loves those who fight in His cause in a row as though they are a [single] structure joined firmly.","আল্লাহ তাদেরকে ভালবাসেন, যারা তাঁর পথে সারিবদ্ধভাবে লড়াই করে, যেন তারা সীসাগালানো প্রাচীর।",[[3,5]]],[61,8,"يُرِيدُونَ لِيُطْفِـُٔوا۟ نُورَ ٱللَّهِ بِأَفْوَٰهِهِمْ وَٱللَّهُ مُتِمُّ نُورِهِۦ وَلَوْ كَرِهَ ٱلْكَـٰفِرُونَ","They want to extinguish the light of Allāh with their mouths, but Allāh will perfect His light, although the disbelievers dislike it.","তারা মুখের ফুঁৎকারে আল্লাহর আলো নিভিয়ে দিতে চায়। আল্লাহ তাঁর আলোকে পূর্ণরূপে বিকশিত করবেন যদিও কাফেররা তা অপছন্দ করে।",[[10,7]]],[61,9,"هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ وَلَوْ كَرِهَ ٱلْمُشْرِكُونَ","It is He who sent His Messenger with guidance and the religion of truth to manifest it over all religion, although those who associate others with Allāh dislike it.","তিনি তাঁর রসূলকে পথ নির্দেশ ও সত্যধর্ম নিয়ে প্রেরণ করেছেন, যাতে একে সবধর্মের উপর প্রবল করে দেন যদিও মুশরিকরা তা অপছন্দ করে।",[[13,7]]],[61,13,"وَأُخْرَىٰ تُحِبُّونَهَا ۖ نَصْرٌۭ مِّنَ ٱللَّهِ وَفَتْحٌۭ قَرِيبٌۭ ۗ وَبَشِّرِ ٱلْمُؤْمِنِينَ","And [you will obtain] another [favor] that you love - victory from Allāh and an imminent conquest; and give good tidings to the believers.","এবং আরও একটি অনুগ্রহ দিবেন, যা তোমরা পছন্দ কর। আল্লাহর পক্ষ থেকে সাহায্য এবং আসন্ন বিজয়। মুমিনদেরকে এর সুসংবাদ দান করুন।",[[2,5]]],[62,6,"قُلْ يَـٰٓأَيُّهَا ٱلَّذِينَ هَادُوٓا۟ إِن زَعَمْتُمْ أَنَّكُمْ أَوْلِيَآءُ لِلَّهِ مِن دُونِ ٱلنَّاسِ فَتَمَنَّوُا۟ ٱلْمَوْتَ إِن كُنتُمْ صَـٰدِقِينَ","Say, \"O you who are Jews, if you claim that you are allies of Allāh, excluding the [other] people, then wish for death, if you should be truthful.\"","বলুন হে ইহুদীগণ, যদি তোমরা দাবী কর যে, তোমরাই আল্লাহর বন্ধু-অন্য কোন মানব নয়, তবে তোমরা মৃত্যু কামনা কর যদি তোমরা সত্যবাদী হও।",[[13,6]]],[62,7,"وَلَا يَتَمَنَّوْنَهُۥٓ أَبَدًۢا بِمَا قَدَّمَتْ أَيْدِيهِمْ ۚ وَٱللَّهُ عَلِيمٌۢ بِٱلظَّـٰلِمِينَ","But they will not wish for it, ever, because of what their hands have put forth. And Allāh is Knowing of the wrongdoers.","তারা নিজেদের কৃতকর্মের কারণে কখনও মৃত্যু কামনা করবে না। আল্লাহ জালেমদের সম্পর্কে সম্যক অবগত আছেন।",[[2,6]]],[63,4,"۞ وَإِذَا رَأَيْتَهُمْ تُعْجِبُكَ أَجْسَامُهُمْ ۖ وَإِن يَقُولُوا۟ تَسْمَعْ لِقَوْلِهِمْ ۖ كَأَنَّهُمْ خُشُبٌۭ مُّسَنَّدَةٌۭ ۖ يَحْسَبُونَ كُلَّ صَيْحَةٍ عَلَيْهِمْ ۚ هُمُ ٱلْعَدُوُّ فَٱحْذَرْهُمْ ۚ قَـٰتَلَهُمُ ٱللَّهُ ۖ أَنَّىٰ يُؤْفَكُونَ","And when you see them, their forms please you, and if they speak, you listen to their speech. [They are] as if they were pieces of wood propped up - they think that every shout is against them. They are the enemy, so beware of them. May Allāh destroy them; how are they deluded?","আপনি যখন তাদেরকে দেখেন, তখন তাদের দেহাবয়ব আপনার কাছে প্রীতিকর মনে হয়। আর যদি তারা কথা বলে, তবে আপনি তাদের কথা শুনেন। তারা প্রাচীরে ঠেকানো কাঠসদৃশ্য। প্রত্যেক শোরগোলকে তারা নিজেদের বিরুদ্ধে মনে করে। তারাই শত্রু, অতএব তাদের সম্পর্কে সতর্ক হোন। ধ্বংস করুন আল্লাহ তাদেরকে। তারা কোথায় বিভ্রান্ত হচ্ছে",[[3,16],[18,0]]],[64,14,"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِنَّ مِنْ أَزْوَٰجِكُمْ وَأَوْلَـٰدِكُمْ عَدُوًّۭا لَّكُمْ فَٱحْذَرُوهُمْ ۚ وَإِن تَعْفُوا۟ وَتَصْفَحُوا۟ وَتَغْفِرُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌ","O you who have believed, indeed, among your spouses and your children are enemies to you, so beware of them. But if you pardon and overlook and forgive - then indeed, Allāh is Forgiving and Merciful.","হে মুমিনগণ, তোমাদের কোন কোন স্ত্রী ও সন্তান-সন্ততি তোমাদের দুশমন। অতএব তাদের ব্যাপারে সতর্ক থাক। যদি মার্জনা কর, উপেক্ষা কর, এবং ক্ষমা কর, তবে আল্লাহ ক্ষমাশীল, করুনাময়।",[[10,0],[18,18]]],[65,4,"وَٱلَّـٰٓـِٔى يَئِسْنَ مِنَ ٱلْمَحِيضِ مِن نِّسَآئِكُمْ إِنِ ٱرْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَـٰثَةُ أَشْهُرٍۢ وَٱلَّـٰٓـِٔى لَمْ يَحِضْنَ ۚ وَأُو۟لَـٰتُ ٱلْأَحْمَالِ أَجَلُهُنَّ أَن يَضَعْنَ حَمْلَهُنَّ ۚ وَمَن يَتَّقِ ٱللَّهَ يَجْعَل لَّهُۥ مِنْ أَمْرِهِۦ يُسْرًۭا","And those who no longer expect menstruation among your women - if you doubt, then their period is three months, and [also for] those who have not menstruated. And for those who are pregnant, their term is until they give birth. And whoever fears Allāh - He will make for him of his matter ease.","তোমাদের স্ত্রীদের মধ্যে যাদের ঋতুবর্তী হওয়ার আশা নেই, তাদের ব্যাপারে সন্দেহ হলে তাদের ইদ্দত হবে তিন মাস। আর যারা এখনও ঋতুর বয়সে পৌঁছেনি, তাদেরও অনুরূপ ইদ্দতকাল হবে। গর্ভবর্তী নারীদের ইদ্দতকাল সন্তানপ্রসব পর্যন্ত। যে আল্লাহকে ভয় করে, আল্লাহ তার কাজ সহজ করে দেন।",[[2,9]]],[65,6,"أَسْكِنُوهُنَّ مِنْ حَيْثُ سَكَنتُم مِّن وُجْدِكُمْ وَلَا تُضَآرُّوهُنَّ لِتُضَيِّقُوا۟ عَلَيْهِنَّ ۚ وَإِن كُنَّ أُو۟لَـٰتِ حَمْلٍۢ فَأَنفِقُوا۟ عَلَيْهِنَّ حَتَّىٰ يَضَعْنَ حَمْلَهُنَّ ۚ فَإِنْ أَرْضَعْنَ لَكُمْ فَـَٔاتُوهُنَّ أُجُورَهُنَّ ۖ وَأْتَمِرُوا۟ بَيْنَكُم بِمَعْرُوفٍۢ ۖ وَإِن تَعَاسَرْتُمْ فَسَتُرْضِعُ لَهُۥٓ أُخْرَىٰ","Lodge them [in a section] of where you dwell out of your means and do not harm them in order to oppress them. And if they should be pregnant, then spend on them until they give birth. And if they breastfeed for you, then give them their payment and confer among yourselves in the acceptable way; but if you are in discord, then there may breastfeed for him [i.e., the father] another woman.","তোমরা তোমাদের সামর্থ?2437;নুযায়ী যেরূপ গৃহে বাস কর, তাদেরকেও বসবাসের জন্যে সেরূপ গৃহ দাও। তাদেরকে কষ্ট দিয়ে সংকটাপন্ন করো না। যদি তারা গর্ভবতী হয়, তবে সন্তানপ্রসব পর্যন্ত তাদের ব্যয়ভার বহন করবে। যদি তারা তোমাদের সন্তানদেরকে স্তন্যদান করে, তবে তাদেরকে প্রাপ্য পারিশ্রমিক দেবে এবং এ সম্পর্কে পরস্পর সংযতভাবে পরামর্শ করবে। তোমরা যদি পরস্পর জেদ কর, তবে অন্য নারী স্তন্যদান করবে।",[[9,14]]],[66,1,"يَـٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ","O Prophet, why do you prohibit [yourself from] what Allāh has made lawful for you, seeking the approval of your wives? And Allāh is Forgiving and Merciful.","হে নবী, আল্লাহ আপনার জন্যে যা হালাল করছেন, আপনি আপনার স্ত্রীদেরকে খুশী করার জন্যে তা নিজের জন্যে হারাম করেছেন কেন? আল্লাহ ক্ষমাশীল, দয়াময়।",[[10,12],[14,18]]],[67,3,"ٱلَّذِى خَلَقَ سَبْعَ سَمَـٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَـٰنِ مِن تَفَـٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ","[And] who created seven heavens in layers. You do not see in the creation of the Most Merciful any inconsistency. So return [your] vision [to the sky]; do you see any breaks?","তিনি সপ্ত আকাশ স্তরে স্তরে সৃষ্টি করেছেন। তুমি করুণাময় আল্লাহ তা’আলার সৃষ্টিতে কোন তফাত দেখতে পাবে না। আবার দৃষ্টিফেরাও; কোন ফাটল দেখতে পাও কি",[[10,18]]],[67,8,"تَكَادُ تَمَيَّزُ مِنَ ٱلْغَيْظِ ۖ كُلَّمَآ أُلْقِىَ فِيهَا فَوْجٌۭ سَأَلَهُمْ خَزَنَتُهَآ أَلَمْ يَأْتِكُمْ نَذِيرٌۭ","It almost bursts with rage. Every time a company is thrown into it, its keepers ask them, \"Did there not come to you a warner?\"","ক্রোধে জাহান্নাম যেন ফেটে পড়বে। যখনই তাতে কোন সম্প্রদায় নিক্ষিপ্ত হবে তখন তাদেরকে তার সিপাহীরা জিজ্ঞাসা করবে। তোমাদের কাছে কি কোন সতর্ককারী আগমন করেনি",[[4,4]]],[67,12,"إِنَّ ٱلَّذِينَ يَخْشَوْنَ رَبَّهُم بِٱلْغَيْبِ لَهُم مَّغْفِرَةٌۭ وَأَجْرٌۭ كَبِيرٌۭ","Indeed, those who fear their Lord unseen will have forgiveness and great reward.","নিশ্চয় যারা তাদের পালনকর্তাকে না দেখে ভয় করে, তাদের জন্যে রয়েছে ক্ষমা ও মহাপুরস্কার।",[[3,0]]],[67,19,"أَوَلَمْ يَرَوْا۟ إِلَى ٱلطَّيْرِ فَوْقَهُمْ صَـٰٓفَّـٰتٍۢ وَيَقْبِضْنَ ۚ مَا يُمْسِكُهُنَّ إِلَّا ٱلرَّحْمَـٰنُ ۚ إِنَّهُۥ بِكُلِّ شَىْءٍۭ بَصِيرٌ","Do they not see the birds above them with wings outspread and [sometimes] folded in? None holds them [aloft] except the Most Merciful. Indeed He is, of all things, Seeing.","তারা কি লক্ষ্য করে না, তাদের মাথার উপর উড়ন্ত পক্ষীকুলের প্রতি পাখা বিস্তারকারী ও পাখা সংকোচনকারী? রহমান আল্লাহ-ই তাদেরকে স্থির রাখেন। তিনি সর্ব-বিষয় দেখেন।",[[11,18]]],[67,20,"أَمَّنْ هَـٰذَا ٱلَّذِى هُوَ جُندٌۭ لَّكُمْ يَنصُرُكُم مِّن دُونِ ٱلرَّحْمَـٰنِ ۚ إِنِ ٱلْكَـٰفِرُونَ إِلَّا فِى غُرُورٍ","Or who is it that could be an army for you to aid you other than the Most Merciful? The disbelievers are not but in delusion.","রহমান আল্লাহ তা’আলা ব্যতীত তোমাদের কোন সৈন্য আছে কি, যে তোমাদেরকে সাহায্য করবে? কাফেররা বিভ্রান্তিতেই পতিত আছে।",[[10,18]]],[67,28,"قُلْ أَرَءَيْتُمْ إِنْ أَهْلَكَنِىَ ٱللَّهُ وَمَن مَّعِىَ أَوْ رَحِمَنَا فَمَن يُجِيرُ ٱلْكَـٰفِرِينَ مِنْ عَذَابٍ أَلِيمٍۢ","Say, [O Muḥammad], \"Have you considered: whether Allāh should cause my death and those with me or have mercy upon us, who can protect the disbelievers from a painful punishment?\"","বলুন, তোমরা কি ভেবে দেখেছ-যদি আল্লাহ তা’আলা আমাকে ও আমার সংগীদেরকে ধ্বংস করেন অথবা আমাদের প্রতি দয়া করেন, তবে কাফেরদেরকে কে যন্ত্রণাদায়ক শাস্তি থেকে রক্ষা করবে",[[9,17]]],[67,29,"قُلْ هُوَ ٱلرَّحْمَـٰنُ ءَامَنَّا بِهِۦ وَعَلَيْهِ تَوَكَّلْنَا ۖ فَسَتَعْلَمُونَ مَنْ هُوَ فِى ضَلَـٰلٍۢ مُّبِينٍۢ","Say, \"He is the Most Merciful; we have believed in Him, and upon Him we have relied. And you will [come to] know who it is that is in clear error.\"","বলুন, তিনি পরম করুণাময়, আমরা তাতে বিশ্বাস রাখি এবং তাঁরই উপর ভরসা করি। সত্ত্বরই তোমরা জানতে পারবে, কে প্রকাশ্য পথ-ভ্রষ্টতায় আছে।",[[3,18]]],[68,9,"وَدُّوا۟ لَوْ تُدْهِنُ فَيُدْهِنُونَ","They wish that you would soften [in your position], so they would soften [toward you].","তারা চায় যদি আপনি নমনীয় হন, তবে তারাও নমনীয় হবে।",[[1,6]]],[68,32,"عَسَىٰ رَبُّنَآ أَن يُبْدِلَنَا خَيْرًۭا مِّنْهَآ إِنَّآ إِلَىٰ رَبِّنَا رَٰغِبُونَ","Perhaps our Lord will substitute for us [one] better than it. Indeed, we are toward our Lord desirous.\"","সম্ভবতঃ আমাদের পালনকর্তা পরিবর্তে এর চাইতে উত্তম বাগান আমাদেরকে দিবেন। আমরা আমাদের পালনকর্তার কাছে আশাবাদী।",[[10,6]]],[68,43,"خَـٰشِعَةً أَبْصَـٰرُهُمْ تَرْهَقُهُمْ ذِلَّةٌۭ ۖ وَقَدْ كَانُوا۟ يُدْعَوْنَ إِلَى ٱلسُّجُودِ وَهُمْ سَـٰلِمُونَ","Their eyes humbled, humiliation will cover them. And they used to be invited to prostration while they were sound.","তাদের দৃষ্টি অবনত থাকবে; তারা লাঞ্ছনাগ্রস্ত হবে, অথচ যখন তারা সুস্থ ও স্বাভাবিক অবস্থায় ছিল, তখন তাদেরকে সেজদা করতে আহবান জানানো হত।",[[1,1]]],[68,48,"فَٱصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تَكُن كَصَاحِبِ ٱلْحُوتِ إِذْ نَادَىٰ وَهُوَ مَكْظُومٌۭ","Then be patient for the decision of your Lord, [O Muḥammad], and be not like the companion of the fish [i.e., Jonah] when he called out while he was distressed.","আপনি আপনার পালনকর্তার আদেশের অপেক্ষায় সবর করুন এবং মাছওয়ালা ইউনুসের মত হবেন না, যখন সে দুঃখাকুল মনে প্রার্থনা করেছিল।",[[11,3]]],[69,21,"فَهُوَ فِى عِيشَةٍۢ رَّاضِيَةٍۢ","So he will be in a pleasant life -","অতঃপর সে সুখী জীবন-যাপন করবে",[[4,12]]],[69,50,"وَإِنَّهُۥ لَحَسْرَةٌ عَلَى ٱلْكَـٰفِرِينَ","And indeed, it will be [a cause of] regret upon the disbelievers.","নিশ্চয় এটা কাফেরদের জন্যে অনুতাপের কারণ।",[[2,10]]],[70,11,"يُبَصَّرُونَهُمْ ۚ يَوَدُّ ٱلْمُجْرِمُ لَوْ يَفْتَدِى مِنْ عَذَابِ يَوْمِئِذٍۭ بِبَنِيهِ","They will be shown each other. The criminal will wish that he could be ransomed from the punishment of that Day by his children.","যদিও একে অপরকে দেখতে পাবে। সেদিন গোনাহগার ব্যক্তি পনস্বরূপ দিতে চাইবে তার সন্তান-সন্ততিকে",[[2,6]]],[70,19,"۞ إِنَّ ٱلْإِنسَـٰنَ خُلِقَ هَلُوعًا","Indeed, mankind was created anxious:","মানুষ তো সৃজিত হয়েছে ভীরুরূপে।",[[4,14]]],[70,20,"إِذَا مَسَّهُ ٱلشَّرُّ جَزُوعًۭا","When evil touches him, impatient,","যখন তাকে অনিষ্ট স্পর্শ করে, তখন সে হা-হুতাশ করে।",[[4,14]]],[70,27,"وَٱلَّذِينَ هُم مِّنْ عَذَابِ رَبِّهِم مُّشْفِقُونَ","And those who are fearful of the punishment of their Lord -","এবং যারা তাদের পালনকর্তার শাস্তির সম্পর্কে ভীত-কম্পিত।",[[6,0]]],[70,38,"أَيَطْمَعُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍۢ","Does every person among them aspire to enter a garden of pleasure?","তাদের প্রত্যেকেই কি আশা করে যে, তাকে নেয়ামতের জান্নাতে দাখিল করা হবে",[[1,8]]],[70,44,"خَـٰشِعَةً أَبْصَـٰرُهُمْ تَرْهَقُهُمْ ذِلَّةٌۭ ۚ ذَٰلِكَ ٱلْيَوْمُ ٱلَّذِى كَانُوا۟ يُوعَدُونَ","Their eyes humbled, humiliation will cover them. That is the Day which they had been promised.","তাদের দৃষ্টি থাকবে অবনমিত; তারা হবে হীনতাগ্রস্ত। এটাই সেইদিন, যার ওয়াদা তাদেরকে দেয়া হত।",[[1,1]]],[72,1,"قُلْ أُوحِىَ إِلَىَّ أَنَّهُ ٱسْتَمَعَ نَفَرٌۭ مِّنَ ٱلْجِنِّ فَقَالُوٓا۟ إِنَّا سَمِعْنَا قُرْءَانًا عَجَبًۭا","Say, [O Muḥammad], \"It has been revealed to me that a group of the jinn listened and said, 'Indeed, we have heard an amazing Qur’ān [i.e., recitation].","বলুনঃ আমার প্রতি ওহী নাযিল করা হয়েছে যে, জিনদের একটি দল কোরআন শ্রবণ করেছে, অতঃপর তারা বলেছেঃ আমরা বিস্ময়কর কোরআন শ্রবণ করেছি",[[13,16]]],[72,13,"وَأَنَّا لَمَّا سَمِعْنَا ٱلْهُدَىٰٓ ءَامَنَّا بِهِۦ ۖ فَمَن يُؤْمِنۢ بِرَبِّهِۦ فَلَا يَخَافُ بَخْسًۭا وَلَا رَهَقًۭا","And when we heard the guidance [i.e., the Qur’ān], we believed in it. And whoever believes in his Lord will not fear deprivation or burden.","আমরা যখন সুপথের নির্দেশ শুনলাম, তখন তাতে বিশ্বাস স্থাপন করলাম। অতএব, যে তার পালনকর্তার প্রতি বিশ্বাস করে, সে লোকসান ও জোর-জবরের আশংকা করে না।",[[11,0]]],[73,20,"۞ إِنَّ رَبَّكَ يَعْلَمُ أَنَّكَ تَقُومُ أَدْنَىٰ مِن ثُلُثَىِ ٱلَّيْلِ وَنِصْفَهُۥ وَثُلُثَهُۥ وَطَآئِفَةٌۭ مِّنَ ٱلَّذِينَ مَعَكَ ۚ وَٱللَّهُ يُقَدِّرُ ٱلَّيْلَ وَٱلنَّهَارَ ۚ عَلِمَ أَن لَّن تُحْصُوهُ فَتَابَ عَلَيْكُمْ ۖ فَٱقْرَءُوا۟ مَا تَيَسَّرَ مِنَ ٱلْقُرْءَانِ ۚ عَلِمَ أَن سَيَكُونُ مِنكُم مَّرْضَىٰ ۙ وَءَاخَرُونَ يَضْرِبُونَ فِى ٱلْأَرْضِ يَبْتَغُونَ مِن فَضْلِ ٱللَّهِ ۙ وَءَاخَرُونَ يُقَـٰتِلُونَ فِى سَبِيلِ ٱللَّهِ ۖ فَٱقْرَءُوا۟ مَا تَيَسَّرَ مِنْهُ ۚ وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَأَقْرِضُوا۟ ٱللَّهَ قَرْضًا حَسَنًۭا ۚ وَمَا تُقَدِّمُوا۟ لِأَنفُسِكُم مِّنْ خَيْرٍۢ تَجِدُوهُ عِندَ ٱللَّهِ هُوَ خَيْرًۭا وَأَعْظَمَ أَجْرًۭا ۚ وَٱسْتَغْفِرُوا۟ ٱللَّهَ ۖ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۢ","Indeed, your Lord knows, [O Muḥammad], that you stand [in prayer] almost two thirds of the night or half of it or a third of it, and [so do] a group of those with you. And Allāh determines [the extent of] the night and the day. He has known that you [Muslims] will not be able to do it and has turned to you in forgiveness, so recite what is easy [for you] of the Qur’ān. He has known that there will be among you those who are ill and others traveling throughout the land seeking [something] of the bounty of Allāh and others fighting for the cause of Allāh. So recite what is easy from it and establish prayer and give zakāh and loan Allāh a goodly loan. And whatever good you put forward for yourselves - you will find it with Allāh. It is better and greater in reward. And seek forgiveness of Allāh. Indeed, Allāh is Forgiving and Merciful.","আপনার পালনকর্তা জানেন, আপনি এবাদতের জন্যে দন্ডায়মান হন রাত্রির প্রায় দু’তৃতীয়াংশ, অর্ধাংশ ও তৃতীয়াংশ এবং আপনার সঙ্গীদের একটি দলও দন্ডায়মান হয়। আল্লাহ দিবা ও রাত্রি পরিমাপ করেন। তিনি জানেন, তোমরা এর পূর্ণ হিসাব রাখতে পার না। অতএব তিনি তোমাদের প্রতি ক্ষমা পরায়ন হয়েছেন। কাজেই কোরআনের যতটুকু তোমাদের জন্যে সহজ, ততটুকু আবৃত্তি কর। তিনি জানেন তোমাদের মধ্যে কেউ কেউ অসুস্থ হবে, কেউ কেউ আল্লাহর অনুগ্রহ সন্ধানে দেশে-বিদেশে যাবে এবং কেউ কেউ আল্লাহর পথে জেহাদে লিপ্ত হবে। কাজেই কোরআনের যতটুকু তোমাদের জন্যে সহজ ততটুকু আবৃত্তি কর। তোমরা নামায কায়েম কর, যাকাত দাও এবং আল্লাহকে উত্তম ঋণ দাও। তোমরা নিজেদের জন্যে যা কিছু অগ্রে পাঠাবে, তা আল্লাহর কাছে উত্তম আকারে এবং পুরস্কার হিসেবে বর্ধিতরূপে পাবে। তোমরা আল্লাহর কাছে ক্ষমাপ্রার্থনা কর। নিশ্চয় আল্লাহ ক্ষমাশীল, দয়ালু।",[[78,18]]],[74,15,"ثُمَّ يَطْمَعُ أَنْ أَزِيدَ","Then he desires that I should add more.","এরপরও সে আশা করে যে, আমি তাকে আরও বেশী দেই।",[[2,6]]],[74,53,"كَلَّا ۖ بَل لَّا يَخَافُونَ ٱلْـَٔاخِرَةَ","No! But they do not fear the Hereafter.","কখনও না, বরং তারা পরকালকে ভয় করে না।",[[4,0]]],[75,20,"كَلَّا بَلْ تُحِبُّونَ ٱلْعَاجِلَةَ","No! But you [i.e., mankind] love the immediate","কখনও না, বরং তোমরা পার্থিব জীবনকে ভালবাস",[[3,5]]],[76,7,"يُوفُونَ بِٱلنَّذْرِ وَيَخَافُونَ يَوْمًۭا كَانَ شَرُّهُۥ مُسْتَطِيرًۭا","They [are those who] fulfill [their] vows and fear a Day whose evil will be widespread.","তারা মান্নত পূর্ণ করে এবং সেদিনকে ভয় করে, যেদিনের অনিষ্ট হবে সুদূরপ্রসারী।",[[3,0]]],[76,8,"وَيُطْعِمُونَ ٱلطَّعَامَ عَلَىٰ حُبِّهِۦ مِسْكِينًۭا وَيَتِيمًۭا وَأَسِيرًا","And they give food in spite of love for it to the needy, the orphan, and the captive,","তারা আল্লাহর প্রেমে অভাবগ্রস্ত, এতীম ও বন্দীকে আহার্য দান করে।",[[4,5]]],[76,10,"إِنَّا نَخَافُ مِن رَّبِّنَا يَوْمًا عَبُوسًۭا قَمْطَرِيرًۭا","Indeed, We fear from our Lord a Day austere and distressful.\"","আমরা আমাদের পালনকর্তার তরফ থেকে এক ভীতিপ্রদ ভয়ংকর দিনের ভয় রাখি।",[[2,0]]],[76,11,"فَوَقَىٰهُمُ ٱللَّهُ شَرَّ ذَٰلِكَ ٱلْيَوْمِ وَلَقَّىٰهُمْ نَضْرَةًۭ وَسُرُورًۭا","So Allāh will protect them from the evil of that Day and give them radiance and happiness","অতঃপর আল্লাহ তাদেরকে সেদিনের অনিষ্ট থেকে রক্ষা করবেন এবং তাদেরকে দিবেন সজীবতা ও আনন্দ।",[[8,2]]],[76,27,"إِنَّ هَـٰٓؤُلَآءِ يُحِبُّونَ ٱلْعَاجِلَةَ وَيَذَرُونَ وَرَآءَهُمْ يَوْمًۭا ثَقِيلًۭا","Indeed, these [disbelievers] love the immediate and leave behind them a grave Day.","নিশ্চয় এরা পার্থিব জীবনকে ভালবাসে এবং এক কঠিন দিবসকে পশ্চাতে ফেলে রাখে।",[[3,5]]],[76,31,"يُدْخِلُ مَن يَشَآءُ فِى رَحْمَتِهِۦ ۚ وَٱلظَّـٰلِمِينَ أَعَدَّ لَهُمْ عَذَابًا أَلِيمًۢا","He admits whom He wills into His mercy; but the wrongdoers - He has prepared for them a painful punishment.","তিনি যাকে ইচ্ছা তাঁর রহমতে দাখিল করেন। আর যালেমদের জন্যে তো প্রস্তুত রেখেছেন মর্মন্তুদ শাস্তি।",[[5,17]]],[77,42,"وَفَوَٰكِهَ مِمَّا يَشْتَهُونَ","And fruits from whatever they desire,","এবং তাদের বাঞ্ছিত ফল-মূলের মধ্যে।",[[3,6]]],[78,27,"إِنَّهُمْ كَانُوا۟ لَا يَرْجُونَ حِسَابًۭا","Indeed, they were not expecting an account","নিশ্চয় তারা হিসাব-নিকাশ আশা করত না।",[[4,8]]],[78,37,"رَّبِّ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا ٱلرَّحْمَـٰنِ ۖ لَا يَمْلِكُونَ مِنْهُ خِطَابًۭا","[From] the Lord of the heavens and the earth and whatever is between them, the Most Merciful. They possess not from Him [authority for] speech.","যিনি নভোমন্ডল, ভূমন্ডল ও এতদুভয়ের মধ্যবর্তী সবকিছুর পালনকর্তা, দয়াময়, কেউ তাঁর সাথে কথার অধিকারী হবে না।",[[6,18]]],[78,38,"يَوْمَ يَقُومُ ٱلرُّوحُ وَٱلْمَلَـٰٓئِكَةُ صَفًّۭا ۖ لَّا يَتَكَلَّمُونَ إِلَّا مَنْ أَذِنَ لَهُ ٱلرَّحْمَـٰنُ وَقَالَ صَوَابًۭا","The Day that the Spirit [i.e., Gabriel] and the angels will stand in rows, they will not speak except for one whom the Most Merciful permits, and he will say what is correct.","যেদিন রূহ ও ফেরেশতাগণ সারিবদ্ধভাবে দাঁড়াবে। দয়াময় আল্লাহ যাকে অনুমতি দিবেন, সে ব্যতিত কেউ কথা বলতে পারবে না এবং সে সত্যকথা বলবে।",[[12,18]]],[79,9,"أَبْصَـٰرُهَا خَـٰشِعَةٌۭ","Their eyes humbled.","তাদের দৃষ্টি নত হবে।",[[2,1]]],[79,19,"وَأَهْدِيَكَ إِلَىٰ رَبِّكَ فَتَخْشَىٰ","And let me guide you to your Lord so you would fear [Him]?'\"","আমি তোমাকে তোমার পালনকর্তার দিকে পথ দেখাব, যাতে তুমি তাকে ভয় কর।",[[4,0]]],[79,26,"إِنَّ فِى ذَٰلِكَ لَعِبْرَةًۭ لِّمَن يَخْشَىٰٓ","Indeed in that is a lesson [i.e., warning] for whoever would fear [Allāh].","যে ভয় করে তার জন্যে অবশ্যই এতে শিক্ষা রয়েছে।",[[6,0]]],[79,40,"وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ","But as for he who feared the position of his Lord and prevented the soul from [unlawful] inclination,","পক্ষান্তরে যে ব্যক্তি তার পালনকর্তার সামনে দন্ডায়মান হওয়াকে ভয় করেছে এবং খেয়াল-খুশী থেকে নিজেকে নিবৃত্ত রেখেছে",[[3,0],[9,6]]],[79,45,"إِنَّمَآ أَنتَ مُنذِرُ مَن يَخْشَىٰهَا","You are only a warner for those who fear it.","যে একে ভয় করে, আপনি তো কেবল তাকেই সতর্ক করবেন।",[[5,0]]],[80,9,"وَهُوَ يَخْشَىٰ","While he fears [Allāh],","এমতাবস্থায় যে, সে ভয় করে",[[2,0]]],[80,39,"ضَاحِكَةٌۭ مُّسْتَبْشِرَةٌۭ","Laughing, rejoicing at good news.","সহাস্য ও প্রফুল্ল।",[[2,2]]],[83,31,"وَإِذَا ٱنقَلَبُوٓا۟ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُوا۟ فَكِهِينَ","And when they returned to their people, they would return jesting.","তারা যখন তাদের পরিবার-পরিজনের কাছে ফিরত, তখনও হাসাহাসি করে ফিরত।",[[6,2]]],[84,9,"وَيَنقَلِبُ إِلَىٰٓ أَهْلِهِۦ مَسْرُورًۭا","And return to his people in happiness.","এবং সে তার পরিবার-পরিজনের কাছে হৃষ্টচিত্তে ফিরে যাবে",[[4,2]]],[84,13,"إِنَّهُۥ كَانَ فِىٓ أَهْلِهِۦ مَسْرُورًا","Indeed, he had [once] been among his people in happiness;","সে তার পরিবার-পরিজনের মধ্যে আনন্দিত ছিল।",[[5,2]]],[85,14,"وَهُوَ ٱلْغَفُورُ ٱلْوَدُودُ","And He is the Forgiving, the Affectionate,","তিনি ক্ষমাশীল, প্রেমময়",[[3,18]]],[87,10,"سَيَذَّكَّرُ مَن يَخْشَىٰ","He who fears [Allāh] will be reminded.","যে ভয় করে, সে উপদেশ গ্রহণ করবে",[[3,0]]],[88,2,"وُجُوهٌۭ يَوْمَئِذٍ خَـٰشِعَةٌ","[Some] faces, that Day, will be humbled,","অনেক মুখমন্ডল সেদিন হবে লাঞ্ছিত",[[3,1]]],[88,9,"لِّسَعْيِهَا رَاضِيَةٌۭ","With their effort [they are] satisfied","তাদের কর্মের কারণে সন্তুষ্ট।",[[2,12]]],[89,20,"وَتُحِبُّونَ ٱلْمَالَ حُبًّۭا جَمًّۭا","And you love wealth with immense love.","এবং তোমরা ধন-সম্পদকে প্রাণভরে ভালবাস।",[[1,5],[3,5]]],[89,27,"يَـٰٓأَيَّتُهَا ٱلنَّفْسُ ٱلْمُطْمَئِنَّةُ","[To the righteous it will be said], \"O reassured soul,","হে প্রশান্ত মন",[[3,13]]],[89,28,"ٱرْجِعِىٓ إِلَىٰ رَبِّكِ رَاضِيَةًۭ مَّرْضِيَّةًۭ","Return to your Lord, well-pleased and pleasing [to Him],","তুমি তোমার পালনকর্তার নিকট ফিরে যাও সন্তুষ্ট ও সন্তোষভাজন হয়ে।",[[4,12],[5,12]]],[90,17,"ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُوا۟ وَتَوَاصَوْا۟ بِٱلصَّبْرِ وَتَوَاصَوْا۟ بِٱلْمَرْحَمَةِ","And then being among those who believed and advised one another to patience and advised one another to compassion.","অতঃপর তাদের অন্তর্ভুক্ত হওয়া, যারা ঈমান আনে এবং পরস্পরকে উপদেশ দেয় সবরের ও উপদেশ দেয় দয়ার।",[[9,17]]],[91,15,"وَلَا يَخَافُ عُقْبَـٰهَا","And He does not fear the consequence const Q=(()=>{
  const D=QDATA||{cats:[],verses:[],defn:{},surahs:[]};

  const CATS=D.cats.map((c,i)=>Object.assign({ix:i},c));
  const byKey=new Map(CATS.map(c=>[c.key,c]));
  const verses=D.verses.map(v=>({s:v[0],a:v[1],ar:v[2],en:v[3],bn:v[4],hits:v[5],key:v[0]+':'+v[1]}));
  const byEmo=new Map(CATS.map(c=>[c.key,[]]));
  verses.forEach(v=>{ const seen=new Set(); v.hits.forEach(([p,ci])=>{ const k=CATS[ci].key; if(!seen.has(k)){ seen.add(k); byEmo.get(k).push(v);} }); });
  const VK=new Map(verses.map(v=>[v.key,v]));
  return {CATS,byKey,verses,byEmo,VK,SUR,defn:D.defn};
})();

/* Description cue words (EN + BN) — used only to flag a possible mismatch between what was written and what was marked. */
const CUES={
 grief:/\b(died|death|dead|passed away|funeral|lost (my|our|his|her)|miscarri\w*|demise)\b|মারা|মৃত্যু|ইন্তেকাল|জানাজা|হারিয়ে/i,

function emoMeta(key){ const c=Q.byKey.get(key); if(c) return {key,en:c.en,bn:c.bn,ar:c.ar,v:(OD[key]||{}).v||'mix',builtin:true};
  const o=S.options.find(o=>o.list==='emotion'&&o.value===key&&o.status!=='hidden');
  if(o){ const m=o.mapTo&&Q.byKey.get(o.mapTo); return {key,en:o.value,bn:'',ar:'',v:m?(OD[o.mapTo]||{}).v:'mix',builtin:false,mapTo:o.mapTo||'',evaluating:!o.mapTo}; }
  return {key,en:key,bn:'',ar:'',v:'mix',builtin:false,evaluating:true}; }
const emoName=k=>k?emoMeta(k).en:'—';
const verseKeyFor=k=>{ const m=emoMeta(k); return m.builtin?k:(m.mapTo||null); };

function scoreEmotion(key,A){
  const od=OD[key]; if(!od) return null;
  let got=0,tot=0,fails=[],mustFail=false,answered=0,coreOk=true;
  if(od.any){ const ans=od.any.filter(c=>A[c[0]]); if(!ans.some(c=>c[1].includes(A[c[0]]))) coreOk=false; if(ans.length){ answered++; tot+=3; if(ans.some(c=>c[1].includes(A[c[0]]))) got+=3; else { mustFail=true; fails.push(od.anyWhy); } } }
  od.c.forEach(([q,ok,w,must,why])=>{ if(must&&!(A[q]&&ok.includes(A[q]))) coreOk=false; if(!A[q]) return; answered++; tot+=w; if(ok.includes(A[q])) got+=w; else { fails.push(why+' — you answered “'+optLabel(q,A[q])+'”'); if(must) mustFail=true; } });
  return {key, ratio: tot? got/tot : null, answered, fails, mustFail, coreOk};
}
function runCheck(ev){
  const A=ev.appraisal||{}, F=ev.feeling||{};
  const nAns=Object.values(A).filter(Boolean).length;
  const res={expected:[],status:'unchecked',reasons:[],cues:[],flag:'',checkedAt:new Date().toISOString()};
  const scores=Object.keys(OD).map(k=>scoreEmotion(k,A)).filter(s=>s&&s.answered>0);
  res.expected=scores.filter(s=>s.coreOk&&!s.mustFail&&s.ratio>=.67&&s.answered>=2).sort((a,b)=>b.ratio-a.ratio||b.answered-a.answered).slice(0,4).map(s=>s.key);
  const text=[ev.glimpse,ev.context,ev.trigger,ev.thought].join(' ');
  Object.entries(CUES).forEach(([k,re])=>{ if(re.test(text)||re.test(normBn(text))) res.cues.push(k); });
  if(!F.primary){ res.status='unchecked'; return res; }
  const key=verseKeyFor(F.primary)||F.primary; const vMark=emoMeta(F.primary).v;
  if(!OD[key]){ res.status='unchecked'; res.reasons.push('This emotion is under evaluation — it has no operational definition yet.'); return res; }
  if(nAns<3){ res.status='unchecked'; res.reasons.push('Answer at least 3 of the quick questions to check the fit.'); return res; }
  const s=scoreEmotion(key,A);
  if(s.answered===0){ res.status='unchecked'; res.reasons.push('None of the answered questions bear on '+emoName(key)+'. Answer the related ones to check the fit.'); }
  else if(s.mustFail||s.ratio<.34){ res.status='mismatch'; res.reasons=s.fails; }
  else if(s.ratio<.67){ res.status='partial'; res.reasons=s.fails; }
  else res.status='fit';
  // description cues pulling the opposite way
  res.cues.forEach(k=>{ const v=OD[k].v; if(k!==key && ((v==='neg'&&vMark==='pos')||(v==='pos'&&vMark==='neg')) && !(F.secondary||[]).includes(k)){
    res.reasons.push('Your description reads like '+emoName(k)+' ('+(v==='neg'?'painful':'pleasant')+'), but '+emoName(F.primary)+' is marked.');
    if(res.status==='fit') res.status='partial'; } });
  if(res.status==='mismatch') res.flag='mismatch';
  return res;
}

const apiUrl=(()=>{ const q=new URLSearchParams(location.search).get('api'); if(q) LS.set('api',q); return API_URL||LS.get('api','')||''; })();
const DEMO=!apiUrl;
async function call(action,payload){
  payload=Object.assign({action,token:S.token},payload||{});
  if(DEMO) return Demo.handle(payload);
  let r;
  try{ r=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); }
  catch(e){ throw new Error('Cannot reach the server. Check your connection.'); }
  const j=await r.json().catch(()=>({ok:false,error:'Server returned an unreadable reply.'}));
  if(!j.ok){ if(j.error==='SESSION_EXPIRED'){ logoutLocal(); throw new Error('Session expired — please log in again.'); } throw new Error(j.error||'Request failed'); }
  return j;
}

function wireAuth(){
  $$('[data-go]').forEach(b=>b.onclick=()=>{ AU.err=''; AU.pin=''; AU.pin1=''; if(b.dataset.go==='forgot') AU.purpose='reset'; if(b.dataset.go==='register') AU.purpose='register'; renderAuth(b.dataset.go); });

  const send=$('#aSend'); if(send) send.onclick=reqOtp;
  const rs=$('#aResend'); if(rs) rs.onclick=reqOtp;
  const v=$('#aVerify'); if(v) v.onclick=verifyOtp;
  const o=$('#aOtp'); if(o){ o.focus(); o.oninput=()=>{ o.value=o.value.replace(/\D/g,''); if(o.value.length===6) verifyOtp(); }; }
  $$('.pinpad [data-k]').forEach(b=>b.onclick=()=>pinKey(b.dataset.k));

async function reqOtp(){
  const n=$('#aName'), p=$('#aPhone'), w=$('#aWa');
  if(n) AU.name=n.value.trim(); if(p) AU.phone=p.value.trim(); if(w) AU.wa=w.value.trim();
  AU.err='';
  if(AU.purpose==='register'&&!AU.name){ AU.err='Please enter your name.'; return renderAuth(); }
  if(!validPhone(AU.phone)){ AU.err='Enter a valid phone number (e.g. 01712345678).'; return renderAuth(); }
  if(AU.purpose==='register'&&!AU.sameWa&&!validPhone(AU.wa)){ AU.err='Enter a valid WhatsApp number.'; return renderAuth(); }
  AU.busy=true; renderAuth();
  try{ AU.info=await call('reqOtp',{name:AU.name,phone:AU.phone,wa:AU.purpose==='register'&&!AU.sameWa?AU.wa:'',purpose:AU.purpose}); AU.busy=false; renderAuth('otp'); }
  catch(e){ AU.busy=false; AU.err=e.message; renderAuth(); }
}
async function verifyOtp(){
  const code=($('#aOtp')||{}).value||''; if(!/^\d{6}$/.test(code)){ AU.err='Enter the 6-digit code.'; return renderAuth(); }
  AU.busy=true; AU.err='';
  try{ const r=await call('verifyOtp',{phone:AU.phone,code}); AU.setupToken=r.setupToken; AU.busy=false; AU.pin=''; AU.pin1=''; renderAuth('setpin'); }
  catch(e){ AU.busy=false; AU.err=e.message; renderAuth(); }
}
async function pinKey(k){
  if(AU.busy) return;
  if(k==='⌫'){ AU.pin=AU.pin.slice(0,-1); AU.err=''; return renderAuth(); }
  if(AU.pin.length>=4) return; AU.pin+=k; AU.err='';
  if(AU.pin.length<4) return renderAuth();
  renderAuth();
  if(AU.step==='setpin'){
    if(!AU.pin1){ AU.pin1=AU.pin; AU.pin=''; return setTimeout(()=>renderAuth(),150); }
    if(AU.pin1!==AU.pin){ AU.pin=''; AU.pin1=''; AU.err='PINs did not match. Try again.'; return renderAuth(); }
    AU.busy=true;
    try{ const r=await call('setPin',{setupToken:AU.setupToken,pin:AU.pin}); AU.busy=false; startSession(r); }
    catch(e){ AU.busy=false; AU.pin=''; AU.pin1=''; AU.err=e.message; renderAuth(); }
  } else {
    const ph=$('#aPhone'); if(ph) AU.phone=ph.value.trim();
    if(!validPhone(AU.phone)){ AU.pin=''; AU.err='Enter your phone number first.'; return renderAuth(); }
    AU.busy=true;
    try{ const r=await call('login',{phone:AU.phone,pin:AU.pin}); AU.busy=false; startSession(r); }
    catch(e){ AU.busy=false; AU.pin=''; AU.err=e.message; renderAuth(); }
  }
}

const F=(t,b)=>'<label class="f">'+esc(t)+'<span class="bn">'+esc(b)+'</span></label>';
const seg=(opts,cur)=>opts.map(([v,l])=>'<button type="button" data-v="'+esc(v)+'" aria-pressed="'+(cur===v)+'">'+esc(l)+'</button>').join('');
function chips(list,selected,single,path){

function checkHtml(e,live){

function setPath(o,path,v){ const ks=path.split('.'); let x=o; ks.slice(0,-1).forEach(k=>{ x[k]=x[k]||{}; x=x[k]; }); x[ks[ks.length-1]]=v; }

    const sx=JSON.stringify(x==null?'':x), sy=JSON.stringify(y==null?'':y); if(sx!==sy&&!(sx==='""'&&sy==='[]')&&!(sx==='[]'&&sy==='""')) out.push({field:p,from:x==null?'':x,to:y==null?'':y}); };

function renderHome(main){ main.innerHTML=dashboardHtml(S.events,S.user.name,true); wireDash(main); }
function dashboardHtml(evs,name,own){
  const n=evs.length;
  if(!n) return '<div class="card"><h2>Assalamu alaikum, '+esc(name.split(' ')[0])+'</h2><p class="ink2">Nothing recorded yet. Each event you record builds this dashboard: what you feel most, what triggers it, who and where it involves, how it changes after reflection — and what the Qur’an says about each feeling.</p><button class="btn" onclick="go(\'new\')">+ Record the first event</button></div>'+quranTeaser();

  h+='<div class="card"><h3>Insights</h3>'+insights(evs).map(([ic,t])=>'<div class="insight"><span class="ic">'+ic+'</span><div>'+t+'</div></div>').join('')+'</div>';

function quranTeaser(){ return '<div class="card"><h3>Explore the Qur’an by feeling</h3><div class="chips" style="margin-top:8px">'+Q.CATS.filter(c=>c.key!=='divine').map(c=>'<a class="chip" style="text-decoration:none;color:inherit" href="#/quran/'+c.key+'">'+esc(c.en)+' <small>'+(Q.byEmo.get(c.key)||[]).length+'</small></a>').join('')+'</div></div>'; }
const kpi=(b,s,sm)=>'<div class="kpi"><b>'+esc(b)+'</b><span>'+esc(s)+'</span>'+(sm?'<small class="mute">'+esc(sm)+'</small>':'')+'</div>';
function bars(rows){ const mx=Math.max(1,...rows.map(r=>r[1])); return '<div class="bars">'+rows.map(([l,n,cls,href])=>(href&&href.length>8?'<a class="brow" style="color:inherit;text-decoration:none;cursor:pointer" href="'+href+'" title="'+esc(l)+': '+n+' — open verses">':'<div class="brow" title="'+esc(l)+': '+n+'">')+

function weekChart(evs){
  const W0=new Date(); W0.setHours(0,0,0,0); W0.setDate(W0.getDate()-((W0.getDay()+6)%7)); const weeks=[];
  for(let i=11;i>=0;i--){ const s=new Date(W0-i*7*864e5); weeks.push({s,pos:0,neg:0,mix:0}); }
  evs.forEach(e=>{ const d=evDate(e); const w=weeks.find((w,i)=>d>=w.s&&(i===11||d<weeks[i+1].s)); if(w) w[emoMeta(e.feeling.primary).v||'mix']++; });
  const mx=Math.max(1,...weeks.map(w=>w.pos+w.neg+w.mix)); const Wd=600,H=170,pl=24,pb=22,bw=(Wd-pl)/12;
  let s='<div class="chart"><svg viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Events per week">';
  [0,.5,1].forEach(t=>{ const y=H-pb-(H-pb-10)*t; s+='<line x1="'+pl+'" x2="'+Wd+'" y1="'+y+'" y2="'+y+'" stroke="#e4e0d6"/><text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(mx*t)+'</text>'; });
  weeks.forEach((w,i)=>{ let y=H-pb; const x=pl+i*bw+bw*.18, bwid=bw*.64;
    [['neg','#d9622b'],['mix','#a8a499'],['pos','#2a78d6']].forEach(([k,c])=>{ if(!w[k]) return; const hh=(H-pb-10)*w[k]/mx; y-=hh; s+='<rect x="'+x+'" y="'+(y+1)+'" width="'+bwid+'" height="'+Math.max(1,hh-2)+'" rx="3" fill="'+c+'"><title>Week of '+w.s.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+': '+w[k]+' '+({neg:'painful',mix:'mixed',pos:'pleasant'}[k])+'</title></rect>'; });
    if(i%2===0) s+='<text x="'+(x+bwid/2)+'" y="'+(H-6)+'" text-anchor="middle">'+w.s.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</text>'; });
  return s+'</svg></div><div class="legend"><span><i style="background:#d9622b"></i>Painful</span><span><i style="background:#a8a499"></i>Mixed</span><span><i style="background:#2a78d6"></i>Pleasant</span></div>';
}
function intensityChart(evs){
  const a=[...evs].sort((x,y)=>evDate(x)-evDate(y)).slice(-40); if(a.length<2) return '<div class="hint">Needs at least 2 events.</div>';
  const Wd=600,H=170,pl=24,pb=20; const x=i=>pl+(Wd-pl-10)*i/(a.length-1), y=v=>H-pb-(H-pb-10)*v/10;
  let s='<div class="chart"><svg viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Intensity over time">';
  [0,5,10].forEach(t=>s+='<line x1="'+pl+'" x2="'+Wd+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="#e4e0d6"/><text x="'+(pl-6)+'" y="'+(y(t)+3)+'" text-anchor="end">'+t+'</text>');
  const ra=a.map((e,i)=>{ const w=a.slice(Math.max(0,i-2),i+1); return w.reduce((s,e)=>s+ +e.feeling.intensity,0)/w.length; });
  s+='<path d="'+ra.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('')+'" fill="none" stroke="#0f3d3a" stroke-width="2"/>';
  a.forEach((e,i)=>{ const v=emoMeta(e.feeling.primary).v; s+='<circle cx="'+x(i)+'" cy="'+y(+e.feeling.intensity)+'" r="4.5" fill="'+(v==='neg'?'#d9622b':v==='pos'?'#2a78d6':'#a8a499')+'" stroke="#fffdf9" stroke-width="2"><title>'+fmtDate(evDate(e))+' · '+emoName(e.feeling.primary)+' '+e.feeling.intensity+'/10 — '+e.glimpse.replace(/</g,'')+'</title></circle>'; });
  s+='<text x="'+pl+'" y="'+(H-4)+'">'+fmtDate(evDate(a[0]))+'</text><text x="'+Wd+'" y="'+(H-4)+'" text-anchor="end">'+fmtDate(evDate(a[a.length-1]))+'</text>';
  return s+'</svg></div>';

function heat(evs){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], bands=[['Night','0–6'],['Morning','6–12'],['Afternoon','12–18'],['Evening','18–24']];
  const g=days.map(()=>[0,0,0,0]); evs.filter(e=>e.when.approx!=='unknown'&&e.when.time).forEach(e=>{ const d=evDate(e); g[(d.getDay()+6)%7][Math.floor(d.getHours()/6)]++; });
  const mx=Math.max(1,...g.flat()); const col=v=>!v?'#eeece6':['#cde2fb','#86b6ef','#3987e5','#1c5cab','#0d366b'][Math.min(4,Math.floor(v/mx*4.999))];
  let h='<div class="tscroll"><table class="t" style="text-align:center"><tr><th></th>'+bands.map(b=>'<th style="text-align:center">'+b[0]+'<br><small>'+b[1]+'</small></th>').join('')+'</tr>';
  days.forEach((d,i)=>{ h+='<tr><td style="text-align:left;color:var(--mute)">'+d+'</td>'+g[i].map((v,j)=>'<td style="padding:3px"><div title="'+d+' '+bands[j][0]+': '+v+' events" style="height:26px;border-radius:6px;background:'+col(v)+';color:'+(v/mx>.55?'#fff':'#55524b')+';font-size:12px;line-height:26px">'+(v||'')+'</div></td>').join('')+'</tr>'; });
  return h+'</table></div>';
}
function crossTable(evs){
  const rel=new Map(); evs.forEach(e=>{ const its=e.related.kind==='unknown'?['Unknown']:(e.related.items||[]); its.forEach(r=>{ if(!rel.has(r)) rel.set(r,new Map()); const m=rel.get(r); m.set(e.feeling.primary,(m.get(e.feeling.primary)||0)+1); }); });
  const rows=[...rel.entries()].map(([r,m])=>[r,m,[...m.values()].reduce((a,b)=>a+b,0)]).sort((a,b)=>b[2]-a[2]).slice(0,8);
  if(!rows.length) return '<div class="hint">Record who or what each event relates to.</div>';
  return '<div class="tscroll"><table class="t"><tr><th>Subject</th><th>Events</th><th>Feelings</th></tr>'+rows.map(([r,m,t])=>'<tr><td>'+esc(r)+'</td><td>'+t+'</td><td>'+[...m.entries()].sort((a,b)=>b[1]-a[1]).map(([k,c])=>emoTag(k,' ×'+c)).join(' ')+'</td></tr>').join('')+'</table></div>';
}
function reflSummary(evs){
  const R=evs.flatMap(e=>(e.reflections||[]).map(r=>Object.assign({ev:e},r)));
  if(!R.length) return '<div class="hint">No reflections yet. Open an event and add a realization or reconciliation when it happens — shifts in feeling and intensity are tracked here.</div>';
  const types=new Map(); R.forEach(r=>types.set(r.type,(types.get(r.type)||0)+1));
  const shifts=evs.filter(e=>latestEmotion(e)).map(e=>{ const l=latestEmotion(e); return [e,l]; }).slice(-6);
  return bars([...types.entries()].sort((a,b)=>b[1]-a[1]).map(([k,c])=>[k,c,'']))+'<h4 style="margin-top:12px">Feeling shifts</h4>'+
    shifts.map(([e,l])=>'<div class="insight"><span class="ic">↻</span><div><a href="#/event/'+e.id+'">'+esc(e.glimpse)+'</a><div style="margin-top:3px">'+emoTag(e.feeling.primary,' '+e.feeling.intensity)+' → '+emoTag(l.emotion,' '+l.intensity)+'</div></div></div>').join('');
}
function insights(evs){
  const out=[]; const n=evs.length;
  const by=(f)=>{ const m=new Map(); evs.forEach(e=>{ const v=f(e); (Array.isArray(v)?v:[v]).filter(Boolean).forEach(x=>{ const o=m.get(x)||{n:0,s:0}; o.n++; o.s+=+e.feeling.intensity; m.set(x,o); }); }); return [...m.entries()]; };
  const emo=by(e=>e.feeling.primary).sort((a,b)=>b[1].n-a[1].n);
  if(emo.length) out.push(['◉','<b>'+esc(emoName(emo[0][0]))+'</b> is your most recorded feeling — '+emo[0][1].n+' of '+n+' events ('+Math.round(emo[0][1].n/n*100)+'%).']);
  const pl=by(e=>e.place.type).filter(x=>x[1].n>=2).sort((a,b)=>b[1].s/b[1].n-a[1].s/a[1].n);
  if(pl.length) out.push(['⌂','Events at <b>'+esc(pl[0][0])+'</b> are the most intense — average '+(pl[0][1].s/pl[0][1].n).toFixed(1)+'/10 over '+pl[0][1].n+' events.']);
  const pair=new Map(); evs.forEach(e=>(e.related.items||[]).forEach(r=>{ const k=r+'|'+e.feeling.primary; pair.set(k,(pair.get(k)||0)+1); }));
  const rep=[...pair.entries()].filter(x=>x[1]>=3).sort((a,b)=>b[1]-a[1])[0];
  if(rep){ const [r,k]=rep[0].split('|'); out.push(['↺','Repeating pattern: <b>'+esc(emoName(k))+'</b> with <b>'+esc(r)+'</b> — '+rep[1]+' times. Worth a reflection entry on what keeps it going.']); }
  const stale=evs.filter(e=>e.status!=='resolved'&&daysAgo(evDate(e))>14&&!(e.reflections||[]).length);
  if(stale.length) out.push(['⏳',stale.length+' open event'+(stale.length>1?'s are':' is')+' older than 14 days with no reflection yet.']);
  const fl=evs.filter(e=>e.check&&e.check.flag==='mismatch');
  if(fl.length) out.push(['⚑',fl.length+' event'+(fl.length>1?'s have':' has')+' a mismatch between what was described and what was marked — <a href="#/events" onclick="S.filters.flag=\'flag\'">review</a>.']);
  const upset=evs.filter(e=>(e.giver.mindset||[]).some(m=>/upset|ammarah|confused/i.test(m)));
  if(upset.length>=2) out.push(['✎',Math.round(upset.length/n*100)+'% of entries were written while still upset — re-read those later and add a realization if your view changed.']);
  const rec=evs.filter(e=>e.timeline.pattern==='recurring'||e.history.level==='pattern');
  if(rec.length) out.push(['∞',rec.length+' event'+(rec.length>1?'s are':' is')+' part of a recurring or long-standing pattern.']);
  const think=by(e=>e.thinking).sort((a,b)=>b[1].n-a[1].n);
  if(think.length&&think[0][1].n>=2) out.push(['💭','Most frequent thinking pattern: <b>'+esc(think[0][0])+'</b> ('+think[0][1].n+' times).']);
  if(!out.length) out.push(['·','Keep recording — patterns appear after a few events.']);
  return out;
}

  main.querySelectorAll('[data-oop]').forEach(b=>b.onclick=async()=>{ const op=b.dataset.oop; let value; if(op==='rename'){ value=prompt('New name'); if(!value) return; }
    try{ const r=await call('adminOption',{id:b.dataset.o,op,value}); S.admin.options=r.options; S.options=r.options; renderAdmin(main); }catch(e){ toast(e.message); } });
  main.querySelectorAll('[data-map]').forEach(s=>s.onchange=async()=>{ try{ const r=await call('adminOption',{id:s.dataset.map,op:'map',mapTo:s.value}); S.admin.options=r.options; S.options=r.options; toast(s.value?'Mapped — verses and definition now apply':'Unmapped'); renderAdmin(main); }catch(e){ toast(e.message); } });
  const oa=$('#olAdd'); if(oa) oa.onclick=async()=>{ const v=$('#olVal').value.trim(); if(!v) return; try{ const r=await call('adminOption',{op:'add',list:$('#olList').value,value:v}); S.admin.options=r.options; S.options=r.options; renderAdmin(main); }catch(e){ toast(e.message); } };
  main.querySelectorAll('[data-set]').forEach(g=>g.onclick=async ev=>{ const b=ev.target.closest('button'); if(!b) return; try{ const r=await call('adminSettings',{key:g.dataset.set,value:b.dataset.v}); S.admin.settings=r.settings; renderAdmin(main); toast('Saved'); }catch(e){ toast(e.message); } });
  const sm=$('#stMailSave'); if(sm) sm.onclick=async()=>{ try{ const r=await call('adminSettings',{key:'NOTIFY_EMAIL',value:$('#stMail').value.trim()}); S.admin.settings=r.settings; toast('Saved'); }catch(e){ toast(e.message); } };
}

/* ============================ start ============================ */
boot();
</script>
</body>
</html>
